    plDrag = false; const f = +e.target.value / 1000;
    if (isFinite(aud.duration)) aud.currentTime = f * aud.duration;
  });

  /* ---------- Biblioteka wiedzy: short lessons and books in a nutshell, shared by everyone (built from app/wiedza.md by build.py).
     Audio files are public (nothing personal in them) and listed in a manifest made by GitHub Actions. Progress: app/wiedza ---------- */
  const LIB = [{"id": "po-co-inwestowac", "tytul": "Po co w ogóle inwestować", "sciezka": "podstawy", "poziom": "p", "min": 4, "akcja": "Ustaw swój cel | cele:cele", "tresc": "Wyobraź sobie, że odkładasz tysiąc złotych do skarbonki. Po dziesięciu latach wyciągasz dokładnie tysiąc złotych. Tylko że za te pieniądze kupisz już wyraźnie mniej niż dziesięć lat temu. To robi inflacja: ceny rosną, a pieniądz leżący bez ruchu po cichu traci wartość.\n\nPrzy inflacji na poziomie trzech procent rocznie pieniądze tracą mniej więcej jedną czwartą siły nabywczej w dziesięć lat. Nie widać tego na koncie, bo kwota się nie zmienia. Widać to w sklepie.\n\n## Co robi inwestowanie\n\nInwestowanie to oddanie pieniędzy do pracy. Kupując fundusz akcji, stajesz się drobnym współwłaścicielem tysięcy firm na całym świecie. Te firmy zarabiają, rosną i dzielą się zyskiem. Przez dziesięciolecia akcje rosły szybciej niż inflacja, i to wyraźnie. Szeroki rynek światowy dawał historycznie średnio kilka procent rocznie ponad inflację.\n\nHaczyk jest jeden: po drodze bywają duże spadki. Dlatego inwestuje się pieniądze, których nie będziesz potrzebować przez wiele lat. Krótki horyzont i akcje to zły duet. Długi horyzont i akcje to duet, który historycznie działał.\n\n## Co z tego wynika dla Ciebie\n\nNajpierw poduszka finansowa na nagłe wydatki. Potem regularne, nudne wpłaty co miesiąc. Bez zgadywania, kiedy jest dobry moment. NKU pilnuje za Ciebie planu, a Ty pilnujesz jednego: żeby wpłaty szły dalej."}, {"id": "procent-skladany", "tytul": "Procent składany: czas jest ważniejszy niż kwota", "sciezka": "podstawy", "poziom": "p", "min": 4, "akcja": "Policz w kalkulatorze | cele:kalk", "tresc": "Procent składany to zysk od zysku. Zarabiasz nie tylko na tym, co wpłaciłeś, ale też na tym, co już zarobiłeś wcześniej. Na początku efekt jest niewidoczny. Po latach staje się najważniejszą siłą w całym portfelu.\n\n## Prosty przykład\n\nWpłacasz pięćset złotych miesięcznie i zakładasz, że portfel rośnie średnio o sześć procent rocznie. Po dziesięciu latach wpłacisz sześćdziesiąt tysięcy, a portfel będzie wart około osiemdziesięciu tysięcy. Po dwudziestu latach wpłacisz sto dwadzieścia tysięcy, a portfel będzie wart mniej więcej dwieście trzydzieści tysięcy. Po trzydziestu latach wpłacisz sto osiemdziesiąt tysięcy, a portfel może być wart około pół miliona.\n\nZauważ, co się dzieje. W pierwszych latach większość wartości to Twoje wpłaty. Po kilkunastu latach zysk zaczyna przerastać wpłaty. To dlatego mówi się, że najlepszy moment na start był wczoraj, a drugi najlepszy jest dziś.\n\n## Trzy dźwignie\n\nMasz wpływ na trzy rzeczy: ile wpłacasz, jak długo i ile oddajesz po drodze w kosztach i podatkach. Na wynik rynku wpływu nie masz. Dlatego tak ważne są tanie fundusze, konta IKE i IKZE oraz cierpliwość. Każdy procent kosztów rocznie, powtórzony przez dwadzieścia lat, zjada sporą część końcowej kwoty.\n\nSprawdź to sam w kalkulatorze w NKU. Zmień liczbę lat z dziesięciu na dwadzieścia i zobacz, jak zmienia się wynik."}, {"id": "co-to-etf", "tytul": "Czym jest ETF", "sciezka": "podstawy", "poziom": "p", "min": 4, "akcja": "Zobacz, co masz w funduszach | portfel:sklad", "tresc": "ETF to fundusz, który kupujesz na giełdzie jak zwykłą akcję. W środku ma koszyk wielu spółek. Kupując jedną jednostkę funduszu na cały świat, kupujesz kawałek ponad tysiąca firm naraz: od Apple i Nvidii po japońskie banki i europejskie fabryki.\n\n## Dlaczego ETF-y są tak popularne\n\nPo pierwsze, są tanie. Fundusz nie płaci zespołowi analityków za wybieranie spółek, tylko kopiuje indeks. Roczny koszt dobrego funduszu na cały świat to około dwóch dziesiątych procenta. Tradycyjne fundusze aktywne potrafią brać dziesięć razy więcej.\n\nPo drugie, dają rozproszenie. Gdy jedna firma upada, w funduszu z tysiącem spółek prawie tego nie czuć. Ryzyko jednej firmy znika, zostaje tylko ryzyko całego rynku.\n\nPo trzecie, są przejrzyste. Wiesz, jaki indeks fundusz naśladuje i co ma w środku.\n\n## Na co patrzeć przy wyborze\n\nNa indeks, czyli co fundusz kopiuje. Na roczny koszt. Na wielkość funduszu, bo duże fundusze są stabilniejsze. Na to, czy jest akumulujący, czyli sam reinwestuje dywidendy. I na walutę, w której jest notowany na giełdzie, choć to mniej ważne, niż się wydaje.\n\nW NKU każdy Twój fundusz ma kartę. Kliknij go w portfelu, a zobaczysz, jakie spółki ma w środku i jak bardzo się wahał."}, {"id": "ryzyko", "tytul": "Ryzyko: dlaczego portfel spada i co z tym robić", "sciezka": "podstawy", "poziom": "p", "min": 5, "akcja": "Zrób test na kryzys | portfel:sklad", "tresc": "Ryzyko w inwestowaniu to nie tylko szansa, że stracisz. To przede wszystkim to, że po drodze wartość portfela będzie się mocno wahać. Fundusz na cały świat w kryzysie dwa tysiące ósmego roku stracił w szczycie ponad połowę wartości. W pandemii w kilka tygodni spadł o około jedną trzecią. Oba razy później odrobił straty i poszedł wyżej, ale trwało to od kilku miesięcy do kilku lat.\n\n## Zmienność to cena za wyższy zysk\n\nLokata nie spada, ale też ledwo goni inflację. Akcje dają więcej, bo inwestorzy chcą nagrody za znoszenie wahań. Bez wahań nie byłoby tej nagrody. Dlatego spadki nie są błędem w planie, tylko jego częścią.\n\n## Co możesz kontrolować\n\nPo pierwsze, horyzont. Pieniądze potrzebne za rok czy dwa nie powinny być w akcjach. Po drugie, proporcje. Część bezpieczna, na przykład obligacje skarbowe, łagodzi spadki. Po trzecie, rozproszenie. Jeden fundusz na cały świat jest bezpieczniejszy niż jedna branża. Po czwarte, swoje reakcje. Największe straty inwestorzy robią sobie sami, sprzedając w panice na dnie.\n\n## Ćwiczenie\n\nOtwórz w NKU test na kryzys. Zobaczysz, ile w złotych straciłby Twój obecny plan w prawdziwych kryzysach. Zadaj sobie szczere pytanie: czy przy takim spadku spałbym spokojnie? Jeśli nie, plan jest za ryzykowny dla Ciebie, i to jest w porządku. Lepszy plan spokojniejszy, którego się trzymasz, niż agresywny, który porzucisz w najgorszym momencie."}, {"id": "poduszka", "tytul": "Najpierw poduszka finansowa", "sciezka": "podstawy", "poziom": "p", "min": 3, "akcja": "Ustaw poduszkę | cele:cele", "tresc": "Poduszka finansowa to pieniądze na nieprzewidziane sytuacje: zepsute auto, utrata pracy, nagła wizyta u dentysty. Trzymasz je bezpiecznie i pod ręką, na koncie oszczędnościowym albo w obligacjach skarbowych, które łatwo wypłacić.\n\n## Ile odłożyć\n\nZwykle mówi się o trzech do sześciu miesiącach wydatków. Jeśli masz stabilny etat i nikogo na utrzymaniu, wystarczy bliżej trzech. Jeśli prowadzisz firmę albo masz rodzinę, lepiej bliżej sześciu. NKU liczy Twoje średnie wydatki z budżetu, więc łatwo sprawdzić, ile to w złotych.\n\n## Dlaczego przed inwestowaniem\n\nBo bez poduszki każdy nagły wydatek zmusza Cię do sprzedaży funduszy. A los lubi złośliwość: auto psuje się często akurat wtedy, gdy rynek spada. Sprzedajesz wtedy ze stratą i przerywasz procent składany.\n\nPoduszka sprawia też, że łatwiej znosisz spadki. Wiesz, że rachunki są opłacone, więc czerwony portfel to tylko liczba na ekranie, a nie problem do rozwiązania na jutro.\n\n## Najprostsza zasada\n\nNajpierw buduj poduszkę, potem inwestuj. Albo dziel wpłatę: część do poduszki, część do funduszy, aż poduszka będzie pełna. Gdy z niej skorzystasz, uzupełnij ją, zanim wrócisz do pełnych wpłat na fundusze."}, {"id": "ike-ikze", "tytul": "IKE i IKZE: jak nie oddawać dziewiętnastu procent", "sciezka": "konta", "poziom": "p", "min": 5, "akcja": "Sprawdź swoje limity | cele:konta", "tresc": "W Polsce od zysku z inwestycji płacisz zwykle dziewiętnaście procent podatku. Państwo daje jednak dwa specjalne konta na długie oszczędzanie, na których tego podatku można uniknąć albo go zmniejszyć. To IKE i IKZE. Możesz je założyć w biurze maklerskim, na przykład w XTB, i kupować na nich te same fundusze ETF.\n\n## IKE, czyli Indywidualne Konto Emerytalne\n\nNa IKE wpłacasz do rocznego limitu. W dwa tysiące dwudziestym szóstym roku to dwadzieścia osiem tysięcy dwieście sześćdziesiąt złotych. Jeśli wypłacisz pieniądze po sześćdziesiątce i wpłacałeś w co najmniej pięciu różnych latach, nie płacisz od zysku ani złotówki podatku. Przy wcześniejszej wypłacie po prostu oddajesz podatek, jak na zwykłym koncie. Nic więcej nie tracisz.\n\n## IKZE, czyli Indywidualne Konto Zabezpieczenia Emerytalnego\n\nTu limit jest mniejszy: dla osoby na etacie jedenaście tysięcy trzysta cztery złote w dwa tysiące dwudziestym szóstym roku. Za to wpłaty odliczasz od dochodu w zeznaniu rocznym. Jeśli płacisz podatek dwanaście procent, dostajesz od każdej wpłaconej stówki dwanaście złotych zwrotu, a przy trzydziestu dwóch procentach nawet trzydzieści dwa. Przy wypłacie po sześćdziesiątce piątce płacisz zryczałtowane dziesięć procent od całości.\n\n## Co wybrać\n\nNajczęstsza kolejność to: najpierw poduszka, potem IKE, a gdy zostaje więcej, również IKZE. IKZE opłaca się szczególnie przy wyższym progu podatkowym. Pamiętaj, że niewykorzystany limit przepada trzydziestego pierwszego grudnia i nie przechodzi na kolejny rok. NKU przypomina o tym pod koniec roku."}, {"id": "podatek-belki", "tytul": "Podatek Belki i PIT-38 w praktyce", "sciezka": "konta", "poziom": "s", "min": 4, "akcja": "Zobacz podatki w NKU | cele:konta", "tresc": "Podatek Belki to dziewiętnaście procent od zysku kapitałowego. Nazwa wzięła się od ministra finansów, który go wprowadził. Dotyczy zysku ze sprzedaży funduszy, akcji i obligacji, odsetek oraz dywidend.\n\n## Kiedy płacisz\n\nNa zwykłym koncie maklerskim płacisz dopiero wtedy, gdy sprzedasz fundusz z zyskiem. Dopóki trzymasz, podatku nie ma, nawet jeśli fundusz urósł dwa razy. To ważne: fundusz akumulujący, który sam reinwestuje dywidendy, pozwala odkładać podatek na lata, a odroczony podatek dalej pracuje na Ciebie.\n\n## PIT-38\n\nJeśli w danym roku coś sprzedałeś, do końca kwietnia następnego roku składasz zeznanie PIT-38. Broker, na przykład XTB, przysyła na początku roku dokument z podsumowaniem, czyli PIT-8C albo zestawienie dla klientów. Przepisujesz z niego przychód i koszty. Straty z jednego roku możesz odliczać od zysków w kolejnych pięciu latach, w określonych granicach.\n\n## Jak liczy się zysk\n\nPrzy wielu zakupach tego samego funduszu w różnych cenach liczy się zasada pierwsze weszło, pierwsze wyszło. Sprzedajesz najpierw jednostki kupione najwcześniej. NKU liczy to tak samo w karcie Podatki, żebyś przed sprzedażą wiedział, ile mniej więcej oddasz.\n\nNa IKE i IKZE tych rozliczeń nie robisz. To jeszcze jeden powód, żeby długoterminowe pieniądze trzymać właśnie tam."}, {"id": "rdzen-satelity", "tytul": "Rdzeń i satelity: jak zbudowany jest Twój plan", "sciezka": "portfel", "poziom": "s", "min": 4, "akcja": "Zobacz swój plan | portfel:przeglad", "tresc": "Rdzeń i satelity to sposób na połączenie spokoju z własnymi pomysłami. Większość pieniędzy, na przykład sześćdziesiąt procent albo więcej, trafia do rdzenia. To szeroki fundusz na cały świat. Reszta to satelity: mniejsze części na tematy, w które wierzysz, na przykład technologia, ochrona zdrowia albo surowce.\n\n## Po co rdzeń\n\nRdzeń daje rynkowy wynik niemal za darmo. Nie musisz mieć racji co do żadnej branży. Jeśli Twoje satelity zawiodą, rdzeń i tak ciągnie portfel w górę razem z gospodarką świata.\n\n## Po co satelity\n\nSatelity pozwalają działać na podstawie własnych przekonań, w kontrolowanej dawce. Każdy satelita powinien mieć tezę, czyli powód, dla którego jest w portfelu, i warunek, kiedy uznasz, że się mylisz. Bez tego satelity zamieniają się w zbiór przypadkowych zakupów pod wpływem nagłówków.\n\n## Pasma\n\nW NKU każda rola ma cel i pasmo, na przykład dziesięć procent plus minus pięć. Dopóki waga mieści się w paśmie, nic nie robisz. Gdy wychodzi poza nie, kolejne wpłaty kierujesz tam, gdzie jest najmniej względem celu. To pilnuje, żeby jeden satelita, który akurat mocno urósł, nie zdominował portfela.\n\n## Najczęstszy błąd\n\nZbyt wiele satelitów. Każdy kolejny fundusz to więcej pilnowania, a efekt na całość coraz mniejszy. Trzy, cztery dobrze uzasadnione satelity to zwykle więcej niż dość."}, {"id": "rebalans", "tytul": "Rebalansowanie wpłatami", "sciezka": "portfel", "poziom": "s", "min": 3, "akcja": "Zobacz podział wpłaty | portfel:wplata", "tresc": "Z czasem proporcje w portfelu same się rozjeżdżają. To, co rośnie najszybciej, zajmuje coraz większą część. Rebalansowanie to przywracanie proporcji z planu.\n\n## Dwa sposoby\n\nPierwszy: sprzedajesz to, czego jest za dużo, i kupujesz to, czego jest za mało. Działa od razu, ale na zwykłym koncie sprzedaż z zyskiem oznacza podatek, a do tego płacisz prowizje.\n\nDrugi, łagodniejszy: rebalans wpłatami. Nic nie sprzedajesz. Każdą nową wpłatę kierujesz do części, które są najbardziej poniżej celu. To dokładnie robi lista zakupów w NKU. Przy regularnych wpłatach to zwykle wystarcza, żeby portfel trzymał się blisko planu.\n\n## Dlaczego to działa na Twoją korzyść\n\nRebalans zmusza do kupowania tego, co ostatnio radziło sobie gorzej, czyli jest relatywnie tańsze. A to, co mocno urosło, przestajesz dokupować. To dyscyplina, która chroni przed pogonią za modą.\n\n## Kiedy sprzedać\n\nGdy jedna część jest daleko poza pasmem, a wpłaty są za małe, żeby ją dogonić w rozsądnym czasie. Wtedy raz w roku możesz rozważyć sprzedaż, najlepiej na IKE, gdzie nie ma podatku od zysku."}, {"id": "akumulacja-waluty", "tytul": "Fundusz akumulujący, dystrybucyjny i ryzyko walutowe", "sciezka": "portfel", "poziom": "s", "min": 4, "tresc": "Fundusze dzielą się na dwa typy, w zależności od tego, co robią z dywidendami od spółek. Akumulujący reinwestuje je sam, w środku funduszu. Dystrybucyjny wypłaca je na Twoje konto.\n\n## Co wybrać na długi termin\n\nDla budowania majątku w Polsce zwykle lepszy jest akumulujący. Dywidenda wypłacona na zwykłe konto oznacza podatek od razu, a potem musisz ją sam ponownie zainwestować. W funduszu akumulującym pieniądze pracują dalej bez przerwy, a podatek płacisz dopiero przy sprzedaży. Dystrybucyjny ma sens, gdy chcesz żyć z regularnych wypłat.\n\n## Ryzyko walutowe\n\nFundusz na cały świat ma w środku spółki z dolarów, euro, jenów i innych walut. Ty liczysz w złotych. Gdy złoty się umacnia, wartość funduszu w złotych spada, nawet jeśli spółki nie drgnęły. Gdy złoty słabnie, zyskujesz. W NKU w raporcie tygodnia widzisz, ile zmiany to waluty, a ile same fundusze.\n\nWaluta, w jakiej fundusz jest notowany na giełdzie, ma tu małe znaczenie. Liczy się, w jakich walutach są firmy w środku. Fundusz na świat notowany w euro i ten sam fundusz notowany w dolarach to w praktyce to samo ryzyko.\n\n## Czy się zabezpieczać\n\nNa horyzoncie kilkunastu lat wahania walut w dużej mierze się wyrównują, a zabezpieczenie walutowe kosztuje. Dla większości inwestorów długoterminowych rozsądne jest po prostu przyjąć to ryzyko i pamiętać, że część ruchów portfela to złoty, a nie rynek."}, {"id": "timing", "tytul": "Dlaczego nie warto zgadywać rynku", "sciezka": "glowa", "poziom": "s", "min": 4, "tresc": "Kusi, żeby poczekać na spadek i dopiero wtedy kupić. Albo sprzedać przed krachem i wrócić na dnie. Problem w tym, że prawie nikomu to się nie udaje w powtarzalny sposób, również zawodowcom.\n\n## Najlepsze dni są blisko najgorszych\n\nNajwiększe wzrosty giełdy zdarzają się zwykle w środku albo tuż po największych spadkach, gdy strach jest największy. Kto wyszedł z rynku w panice, zwykle przegapia też odbicie. Badania pokazują, że kto przez dwadzieścia lat ominął tylko kilka, kilkanaście najlepszych sesji, mniej więcej o połowę obniżył swój wynik.\n\n## Zawodowcy też nie wygrywają\n\nWiększość aktywnych funduszy, prowadzonych przez opłacanych analityków, przez dziesięć i więcej lat wypada gorzej niż zwykły tani fundusz indeksowy. Rok do roku różnie bywa, ale na dłuższym dystansie wygrywa mniejszość, i trudno ją wskazać z góry.\n\n## Co działa zamiast tego\n\nRegularne wpłaty w stałym rytmie, niezależnie od nastrojów. W złym miesiącu za tę samą kwotę kupujesz więcej jednostek, w dobrym mniej. Do tego zasada na spadki zapisana zawczasu, na spokojnie. W NKU masz ją w swoim profilu i przypominamy ją w prasówce, gdy rynek mocno spada.\n\nCzas spędzony na rynku jest ważniejszy niż wyczucie momentu wejścia na rynek."}, {"id": "krach", "tytul": "Jak przetrwać krach", "sciezka": "glowa", "poziom": "s", "min": 4, "akcja": "Zapisz decyzję w dzienniku | raporty:tezy", "tresc": "Krach przyjdzie. Nie wiadomo kiedy, ale w ciągu dziesięciu lat inwestowania prawie na pewno zobaczysz przynajmniej jeden spadek o dwadzieścia procent albo więcej. Lepiej przygotować się teraz, na spokojnie, niż wymyślać plan w środku paniki.\n\n## Co dzieje się w głowie\n\nStrata boli mniej więcej dwa razy mocniej niż zysk tej samej wielkości cieszy. Do tego dochodzą nagłówki, komentarze i znajomi, którzy właśnie sprzedali. Mózg krzyczy: zrób coś. Najczęściej najlepsze, co możesz zrobić, to nic poza tym, co i tak było w planie.\n\n## Plan na krach, zanim przyjdzie\n\nPo pierwsze: pieniądze potrzebne w ciągu kilku lat nie są w akcjach, a poduszka jest pełna. Po drugie: wiesz, ile w złotych może spaść Twój portfel, bo widziałeś test na kryzys. Po trzecie: masz zapisaną zasadę, na przykład dalej wpłacam co miesiąc i nic nie sprzedaję, chyba że zmieni się teza. Po czwarte: mniej patrzysz. Tryb spokojny w NKU chowa dzienne zmiany.\n\n## Gdy już spada\n\nZapytaj, czy zmieniły się fakty, czy tylko cena. Spadek ceny przy niezmienionych faktach to zwykle wyprzedaż, a nie powód do ucieczki. Zapisz w dzienniku decyzji, co czujesz i co robisz. Za rok przeczytasz to i nauczysz się o sobie więcej niż z każdej książki."}, {"id": "teza", "tytul": "Teza inwestycyjna i warunek „kiedy się mylę”", "sciezka": "glowa", "poziom": "z", "min": 4, "akcja": "Zobacz swoje tezy | raporty:tezy", "tresc": "Teza to krótki powód, dla którego coś jest w Twoim portfelu. Na przykład: ochrona zdrowia, bo społeczeństwa się starzeją, a wydatki na leczenie rosną szybciej niż gospodarka. Dobra teza mieści się w dwóch zdaniach i opiera się na faktach, które da się sprawdzać.\n\n## Warunek „kiedy się mylę”\n\nTo najważniejsza część i najczęściej pomijana. Zapisujesz z góry, jaki fakt sprawi, że uznasz tezę za błędną. Na przykład: jeśli najwięksi gracze w AI przez dwa kwartały z rzędu tną wydatki na centra danych z powodu słabego popytu. Warunek opisuje fakty, a nie cenę. Spadek kursu o dwadzieścia procent to nie jest dowód, że teza upadła.\n\n## Po co to wszystko\n\nBez warunku każda teza żyje wiecznie, bo zawsze znajdzie się powód, żeby jeszcze poczekać. Albo odwrotnie: porzucasz dobrą tezę przy pierwszym spadku. Warunek zapisany na spokojnie chroni przed oboma błędami.\n\n## Jak NKU w tym pomaga\n\nW raporcie tygodnia każda Twoja teza dostaje status: bez zmian, wspierająca, do obserwacji albo sygnał ostrzegawczy. Raport pisze też, czy zbliża się Twój warunek. W obserwatorium możesz śledzić pomysły, zanim staną się tezą, i po roku sprawdzić, czy były trafne."}, {"id": "ks-bogle", "tytul": "Książka w pigułce: John C. Bogle, The Little Book of Common Sense Investing", "sciezka": "ksiazki", "poziom": "p", "min": 5, "tresc": "John Bogle założył Vanguard i stworzył pierwszy fundusz indeksowy dla zwykłych ludzi. Ta krótka książka to jego najprostszy wykład o tym, dlaczego większość inwestorów powinna po prostu kupić cały rynek i trzymać go przez lata. Poniżej najważniejsze myśli, opowiedziane własnymi słowami.\n\n## Inwestorzy razem dostają wynik rynku, minus koszty\n\nWszyscy inwestorzy razem wzięci są właścicielami całego rynku. Przed kosztami ich średni wynik musi być równy wynikowi rynku. Po kosztach, czyli opłatach, prowizjach i podatkach, średni inwestor musi wypaść gorzej. Kto płaci najmniej, ten zatrzymuje najwięcej. To prosta arytmetyka, a nie opinia.\n\n## Koszty zjadają procent składany\n\nRóżnica jednego, dwóch procent rocznie wygląda niewinnie. Przez czterdzieści lat potrafi zabrać jedną trzecią albo połowę końcowego majątku. Bogle przekonuje, że koszty to jedyna rzecz w inwestowaniu, którą masz pod pełną kontrolą, więc warto o nie walczyć.\n\n## Nie szukaj igły, kup cały stóg siana\n\nZamiast szukać funduszu albo spółki, które pobiją rynek, kup rynek w całości. Fundusze, które świetnie radziły sobie w przeszłości, rzadko utrzymują przewagę. Pogoń za zeszłorocznymi zwycięzcami zwykle kończy się kupowaniem drogo.\n\n## Nie przeszkadzaj sobie\n\nNajwiększym wrogiem inwestora jest on sam: zbyt częste zmiany, reagowanie na nagłówki, sprzedawanie w panice. Plan prosty i nudny, utrzymany przez dekady, zwykle wygrywa z planem błyskotliwym, który zmienia się co kwartał.\n\n## Co z tego bierze NKU\n\nRdzeń Twojego planu to dokładnie ta idea: tani fundusz na cały świat i regularne wpłaty. Satelity to Twoja przestrzeń na przekonania, ale rdzeń zostaje fundamentem."}, {"id": "ks-housel", "tytul": "Książka w pigułce: Morgan Housel, The Psychology of Money", "sciezka": "ksiazki", "poziom": "p", "min": 5, "tresc": "Morgan Housel pisze o pieniądzach tak, jakby pisał o ludziach, bo jego zdaniem właśnie o to chodzi. Sukces finansowy mniej zależy od wiedzy, a bardziej od zachowania. Książka składa się z krótkich rozdziałów, a poniżej są jej główne myśli, opowiedziane własnymi słowami.\n\n## Każdy ma swoją historię z pieniędzmi\n\nTo, jak ktoś inwestuje, zależy od tego, co przeżył. Ktoś, kto zaczynał w czasie krachu, będzie ostrożniejszy niż ktoś, kto pamięta tylko wzrosty. Nikt nie jest szalony, każdy działa według swoich doświadczeń. Dobrze wiedzieć, jakie są Twoje.\n\n## Wystarczająco\n\nJedna z najważniejszych umiejętności to wiedzieć, kiedy masz dość. Pogoń za ciągle wyższym celem prowadzi do ryzyka, którego nie trzeba podejmować. Ludzie tracili fortuny, ryzykując to, co mieli i czego potrzebowali, dla czegoś, czego wcale nie potrzebowali.\n\n## Przetrwanie jest ważniejsze niż maksymalny wynik\n\nProcent składany działa tylko wtedy, gdy nie przerwiesz go po drodze. Lepszy przeciętny wynik utrzymany przez trzydzieści lat niż świetny przez pięć, zakończony bankructwem albo paniczną sprzedażą. Stąd zapas bezpieczeństwa, poduszka i rozsądne ryzyko.\n\n## Bogactwo to to, czego nie widać\n\nDrogie auto pokazuje, ile ktoś wydał, a nie ile ma. Prawdziwy majątek to pieniądze, których nie wydałeś. Najcenniejsze, co dają pieniądze, to kontrola nad własnym czasem.\n\n## Rozsądnie zamiast idealnie\n\nNie musisz mieć planu optymalnego na papierze. Wystarczy plan, którego się trzymasz i przy którym dobrze śpisz. To podejście jest wpisane w NKU: proste zasady, tryb spokojny i plan, który ustawiasz pod siebie."}, {"id": "ks-malkiel", "tytul": "Książka w pigułce: Burton Malkiel, A Random Walk Down Wall Street", "sciezka": "ksiazki", "poziom": "s", "min": 5, "tresc": "Burton Malkiel, profesor z Princeton, od kilkudziesięciu lat wznawia tę książkę z nowymi danymi. W Polsce ukazała się pod tytułem Błądząc po Wall Street. Jej główna teza: krótkoterminowe ruchy cen są w dużej mierze nieprzewidywalne, więc zwykłemu inwestorowi najlepiej służy szeroki, tani fundusz indeksowy. Poniżej najważniejsze myśli, opowiedziane własnymi słowami.\n\n## Bańki powtarzają się od wieków\n\nMalkiel opisuje szaleństwa od holenderskiej manii tulipanowej, przez bańkę internetową, po późniejsze spekulacyjne mody. Schemat jest podobny: nowa, ekscytująca historia, rosnące ceny, przekonanie, że tym razem jest inaczej, a potem bolesny koniec. Wniosek: gdy wszyscy wokół mówią o łatwych pieniądzach, warto być ostrożnym.\n\n## Analiza wykresów i wybieranie spółek\n\nAutor przegląda metody przewidywania cen, od rysowania formacji na wykresach po szczegółową analizę spółek. Dane pokazują, że żadna z nich nie daje trwałej przewagi większości stosujących. Informacje szybko trafiają do cen, więc trudno konsekwentnie wyprzedzać rynek.\n\n## Praktyczne rady\n\nZbuduj zapas na nagłe wydatki. Korzystaj z kont z ulgami podatkowymi. Dopasuj ryzyko do wieku i spokoju ducha. Inwestuj regularnie, stałą kwotą. Rozpraszaj i co jakiś czas przywracaj proporcje. Pilnuj kosztów.\n\n## Co z tego wynika dla Ciebie\n\nWiększość tych rad masz już w NKU: poduszkę, IKE i IKZE, regularne wpłaty, pasma i rebalans. Książka jest dobrym przypomnieniem, dlaczego nudny plan to nie wada, tylko zaleta."}, {"id": "ks-graham", "tytul": "Książka w pigułce: Benjamin Graham, The Intelligent Investor", "sciezka": "ksiazki", "poziom": "z", "min": 5, "tresc": "Benjamin Graham był nauczycielem Warrena Buffetta i ojcem inwestowania w wartość. Jego książka, wydana po raz pierwszy w połowie dwudziestego wieku, po polsku jako Inteligentny inwestor, jest długa i miejscami techniczna. Poniżej jej ponadczasowe myśli, opowiedziane własnymi słowami.\n\n## Pan Rynek\n\nGraham proponuje wyobrazić sobie rynek jako wspólnika, który codziennie przychodzi z ofertą kupna albo sprzedaży. Raz jest w euforii i chce dużo, raz w depresji i oddaje za bezcen. Nie musisz słuchać jego nastrojów. Możesz korzystać z jego przesadnych ofert albo po prostu je ignorować. Cena to propozycja, a nie ocena Twojej inwestycji.\n\n## Margines bezpieczeństwa\n\nKupuj tak, żeby nawet przy błędzie w ocenie nie stracić dużo. W praktyce chodzi o płacenie wyraźnie mniej, niż coś jest warte, i o unikanie ryzyka, którego nie rozumiesz. Ta idea dotyczy też całego portfela: rozproszenie i część bezpieczna to margines na nieznane.\n\n## Inwestor defensywny i przedsiębiorczy\n\nGraham dzieli inwestorów na dwa typy. Defensywny nie ma czasu ani chęci na analizy, więc trzyma szeroko rozproszony portfel i stałe proporcje między akcjami a obligacjami. Przedsiębiorczy poświęca dużo pracy na szukanie okazji. Graham uczciwie zaznacza, że połowiczne podejście, czyli trochę pracy i dużo ambicji, zwykle wychodzi najgorzej.\n\n## Inwestycja a spekulacja\n\nInwestycja opiera się na analizie, chroni kapitał i obiecuje rozsądny zwrot. Wszystko inne to spekulacja. Spekulować wolno, ale świadomie, małą kwotą i nazywając rzeczy po imieniu.\n\n## Co z tego bierze NKU\n\nRdzeń i część bezpieczna to podejście inwestora defensywnego. Satelity z tezami i warunkiem kiedy się mylę to Twoja przestrzeń przedsiębiorcza, w kontrolowanej dawce."}, {"id": "dodruk", "tytul": "Dodruk pieniądza i inflacja: jak banki centralne poruszają rynkami", "sciezka": "rynki", "poziom": "s", "min": 5, "zrodlo": "Portfel Tradera, wideo „Na czym polega dodruk?” | https://www.portfeltradera.pl/darmowe-materialy/wideo/na-czym-polega-dodruk", "tresc": "Dodruk to potoczna nazwa sytuacji, w której bank centralny tworzy nowe pieniądze i za nie kupuje na rynku obligacje, najczęściej rządowe. Fachowo mówi się na to luzowanie ilościowe. Nikt nie drukuje banknotów w piwnicy: pieniądze powstają elektronicznie, na kontach banków.\n\n## Po co to się robi\n\nW kryzysie, gdy obniżenie stóp procentowych do zera nie wystarcza, bank centralny sięga po kolejne narzędzie. Kupując obligacje, obniża ich oprocentowanie i zalewa system pieniędzmi. Kredyt tanieje, firmy łatwiej przetrwają, rząd taniej pożycza. Tak było po kryzysie dwa tysiące ósmego roku i w pandemii. Amerykański bank centralny w dwa tysiące dwudziestym pierwszym roku kupował aktywa za około sto dwadzieścia miliardów dolarów miesięcznie. Obligacje skupował wtedy także Narodowy Bank Polski.\n\n## Co to robi z rynkiem\n\nGdy obligacje dają bardzo mało, pieniądze szukają zysku gdzie indziej: w akcjach, nieruchomościach i surowcach. Ceny tych aktywów rosną. Działa to też w drugą stronę. Pod koniec dwa tysiące dwudziestego pierwszego roku amerykański bank centralny zapowiedział stopniowe ograniczanie zakupów, a potem zaczął podnosić stopy i zmniejszać swój bilans. W dwa tysiące dwudziestym drugim roku akcje i obligacje spadały jednocześnie, co zdarza się rzadko. Portfel Tradera przypomina w darmowych materiałach, że ostrzegał przed tym już w listopadzie dwa tysiące dwudziestego pierwszego roku.\n\n## Dodruk a inflacja\n\nSam dodruk nie zawsze wywołuje inflację. Po dwa tysiące ósmym roku pieniądze utknęły głównie w bankach i na rynkach. W pandemii było inaczej: dodruk szedł w parze z ogromnymi wydatkami rządów, wypłatami dla ludzi i zatorami w dostawach. Efekt to najwyższa inflacja od dekad, w Polsce na początku dwa tysiące dwudziestego trzeciego roku ponad osiemnaście procent.\n\n## Co z tego wynika dla Ciebie\n\nPo pierwsze: inflacja to najlepszy argument za inwestowaniem. Gotówka na koncie traci, a udziały w firmach i obligacje indeksowane inflacją dają szansę się przed nią bronić. Po drugie: decyzje banków centralnych mocno ruszają rynkiem w krótkim terminie, dlatego prasówka o nich mówi. Ale próba handlowania pod każdą decyzję zwykle kończy się źle. Twoja ochrona to rozproszony portfel, część bezpieczna w obligacjach skarbowych i regularne wpłaty niezależnie od nagłówków."}, {"id": "saas", "tytul": "Firma na abonament: jak czytać spółki technologiczne", "sciezka": "rynki", "poziom": "z", "min": 6, "zrodlo": "Portfel Tradera, raport „Jak inwestować w spółki technologiczne SaaS?”, czerwiec 2023 | https://www.portfeltradera.pl/darmowe-materialy/pdf/17/raport-o-spolkach-saas-nd.pdf", "tresc": "Duża część Twojego funduszu na cały świat i wszystkich funduszy technologicznych to firmy, które sprzedają oprogramowanie w abonamencie. Ten model nazywa się SaaS, czyli oprogramowanie jako usługa. Zamiast kupić program raz na płycie, płacisz co miesiąc albo co rok, a program działa w chmurze. Przykłady znasz z życia: pakiet biurowy Microsoftu w subskrypcji, programy Adobe, systemy do płac i księgowości w firmach. To streszczenie raportu Portfela Tradera o takich spółkach, opowiedziane własnymi słowami i bez ich wyborów konkretnych akcji.\n\n## Dlaczego inwestorzy lubią ten model\n\nPrzychody powtarzają się co miesiąc, więc są przewidywalne. Firma nie potrzebuje magazynów ani transportu, a ten sam program może sprzedać na cały świat niemal bez dodatkowych kosztów. Klientów jest wielu, więc odejście jednego niewiele zmienia. A raz wdrożony system trudno firmie wymienić, więc klienci zostają latami. W spółkach opisanych w raporcie ponad dziewięćdziesiąt procent klientów przedłużało abonament.\n\n## Co może pójść źle\n\nKonkurencja szybko kopiuje dobre funkcje, a nowi gracze wchodzą tanio. Firma oparta na jednym produkcie jest wrażliwa na lepszego rywala. Do tego dochodzą waluty przy sprzedaży na cały świat i przede wszystkim bezpieczeństwo: wyciek danych klientów to kary i utrata zaufania. Sztuczna inteligencja jest tu jednocześnie szansą, bo pozwala ulepszać produkty i ciąć koszty, i zagrożeniem, bo może obniżyć barierę wejścia dla konkurencji.\n\n## Wskaźniki, które warto znać\n\nPowtarzalny przychód miesięczny i roczny pokazują, ile firma zarabia na samych abonamentach, bez jednorazowych opłat za wdrożenie. Retencja mówi, jaka część klientów zostaje na kolejny okres. Zasada czterdziestu mówi, że tempo wzrostu przychodów plus marża zysku operacyjnego powinny razem dawać co najmniej czterdzieści procent: firma może rosnąć szybko i mało zarabiać albo rosnąć wolniej i zarabiać więcej, ale suma ma być wysoka.\n\nDo tego klasyczne wskaźniki dla każdej spółki. Cena do zysku: ile płacisz za złotówkę rocznego zysku. Zwrot z kapitału: jak dobrze firma obraca pieniędzmi akcjonariuszy. Zwrot z zainwestowanego kapitału porównany z kosztem tego kapitału: czy każda nowa inwestycja firmy zarabia więcej, niż kosztuje. I zadłużenie do kapitału własnego, bo wysoki zwrot osiągnięty na długu to inna jakość niż ten sam zwrot bez długu.\n\n## Co z tego wynika dla Ciebie\n\nNie musisz wybierać pojedynczych spółek: fundusz robi to za Ciebie. Ale gdy w prasówce słyszysz, że spółki technologiczne spadają, bo ktoś obniżył prognozę przychodów abonamentowych albo klienci rzadziej przedłużają umowy, wiesz już, dlaczego rynek tak mocno na to reaguje. To wiedza przydatna przy ocenie Twojej tezy o sztucznej inteligencji."}, {"id": "op-dekada", "tytul": "Opinia w pigułce: co przyniesie kolejna dekada (Capital Report)", "sciezka": "opinie", "poziom": "z", "min": 6, "zrodlo": "Portfel Tradera, Capital Report 02/2025, Marcin Kremiec | https://www.portfeltradera.pl/darmowe-materialy/pdf/24/capital-report-8.pdf", "tresc": "To streszczenie jednego tekstu z kwartalnika Capital Report, który pisze Marcin Kremiec z Portfela Tradera. To prognoza i opinia autora, a nie wiedza pewna. Przedstawiamy ją własnymi słowami, a na końcu pokazujemy drugą stronę medalu.\n\n## Główna teza: kończy się stary porządek\n\nAutor, opierając się na pracach Raya Dalio o cyklach mocarstw, uważa, że świat ustalony po drugiej wojnie światowej, z dominacją Stanów Zjednoczonych, wchodzi w burzliwy okres. Ameryka będzie walczyć o pozycję z Chinami: wojną handlową, technologiczną, a w skrajnym scenariuszu nie tylko. Kolejne dziesięć, piętnaście lat ma przynieść więcej napięć niż ostatnie dekady.\n\n## Dług i druga fala inflacji\n\nWedług autora najważniejszy problem to ogromne zadłużenie bogatych krajów, liczone już na kilkaset procent światowego dochodu. Rządy mają cztery wyjścia: ciąć wydatki, pozwolić na bankructwa, podnieść podatki albo dodrukować pieniądze i utrzymywać inflację. Trzy pierwsze są politycznie bolesne, więc autor spodziewa się czwartego. Pretekstem mają być wydatki na wojsko, które rosną w Polsce, w całej Europie i w Ameryce. Efekt według niego: większe deficyty, słabsze waluty i druga fala inflacji. Do tego dochodzi odwrót od globalizacji, czyli przenoszenie produkcji bliżej domu, co też podnosi koszty.\n\n## Co według autora warto mieć\n\nNa czasy inflacji i niepewności autor wskazuje przede wszystkim złoto, a dalej bitcoina i srebro, czyli aktywa, których nie da się dodrukować. Wśród akcji wymienia branże, które mogą zyskać na rywalizacji mocarstw: półprzewodniki, cyberbezpieczeństwo, zbrojeniówkę, centra danych, energetykę i technologie kosmiczne, a także wybrane surowce. Ostrzega, że gotówka w długim terminie jest jednym z najbardziej ryzykownych miejsc przy wysokiej inflacji, i radzi nie reagować emocjonalnie na newsy, tylko trzymać się własnej strategii.\n\n## Druga strona medalu\n\nPrognozy na dekadę mają słabą historię trafności. Podobne ostrzeżenia przed upadkiem dolara i inflacją pojawiały się po dwa tysiące ósmym roku, a przez kolejną dekadę inflacja była niska, a szeroki rynek akcji amerykańskich dał bardzo dobre wyniki. Złoto i srebro nie wypłacają zysków ani odsetek, a bitcoin potrafi spaść o połowę i więcej. Zakłady na konkretne branże dają większą szansę, ale też większe ryzyko pomyłki niż szeroki fundusz. To nie znaczy, że autor się myli. Znaczy, że nikt tego nie wie na pewno.\n\n## Co z tego wynika dla Ciebie\n\nCzęść tych tematów już jest w Twoim planie: zbrojeniówka, miedź i technologia to Twoje satelity z własnymi tezami. Ten tekst możesz potraktować jako jeden z głosów, który pomaga sprawdzać tezy, a nie jako listę zakupów. Jeśli któryś pomysł Cię przekonuje, na przykład złoto jako ochrona przed inflacją, najlepszym miejscem na start jest obserwatorium: zapisz go, ustaw kierunek i zobacz po roku, jak wypadł na tle świata."}];

      ${o.status === "zamknieta" && o.wniosek ? `<div class="obs-note"><span class="note">Wniosek · ${esc(o.zamknieto || "")}</span><br>${esc(o.wniosek)}</div>` : ""}
      ${S.canWrite ? `<div class="actions" style="margin-top:0">${o.status !== "zamknieta" ? `<button class="go" type="button" data-onote="${esc(o._id)}">Dopisz notatkę</button>${!o.symbol || o.blad_symbolu ? `<button class="go" type="button" data-osym="${esc(o._id)}">${o.symbol ? "Popraw symbol" : "Dodaj symbol"}</button>` : ""}<button class="go" type="button" data-oend="${esc(o._id)}">Zakończ</button>` : ""}${o.autor !== "claude" ? `<button class="go" type="button" data-odel="${esc(o._id)}" style="color:var(--muted)">Usuń</button>` : ""}</div>` : ""}
    </div>`;
  }
  function obsCard() {
    const list = S.obs.filter(o => obsFilter === "zamknieta" ? o.status === "zamknieta" : o.status !== "zamknieta");
    const sc = obsScore(), nAct = S.obs.filter(o => o.status !== "zamknieta").length;
    const score = sc.claude[1] || sc.ja[1] ? `Trafność (wynik lepszy albo gorszy od MSCI World, tak jak zakładał autor): ${[["Claude", sc.claude], ["Ty", sc.ja]].filter(x => x[1][1]).map(([n, v]) => `<strong>${n} ${v[0]} z ${v[1]}</strong>`).join(" · ")}` : "Pierwsze sprawdzenie przychodzi 3 miesiące po starcie obserwacji. Wtedy zobaczysz tu, ile obserwacji, Twoich i Claude, się sprawdziło.";

      <p class="note">${score}</p>
      ${S.canWrite ? `<details class="more" ${S.obs.length ? "" : "open"}><summary>Dodaj obserwację</summary>
        <div style="display:grid;gap:10px;padding-top:6px">
          <div class="field"><label for="o-tyt">Co chcesz obserwować?</label><input id="o-tyt" maxlength="90" placeholder="np. Uran: elektrownie jądrowe wracają do łask"></div>
          <div class="field"><label for="o-op">Dlaczego? Co Twoim zdaniem się stanie?</label><textarea id="o-op" rows="2" placeholder="np. Kraje ogłaszają nowe reaktory, a wydobycie uranu rośnie wolno."></textarea></div>
          <div class="field"><label for="o-sym">Notowanie: symbol z Yahoo (opcjonalnie)</label><input id="o-sym" list="o-syms" autocapitalize="characters" autocomplete="off" placeholder="np. URA. Zostaw puste, Claude dobierze"><datalist id="o-syms">${OBS_SYMBOLE.map(([s, l]) => `<option value="${esc(s)}">${esc(l)}</option>`).join("")}</datalist></div>

          <label class="switch" for="o-kom"><span><strong>Claude, komentuj to w raportach tygodnia</strong><br><span class="note">Sprawdzi fakty, dopisze krótką notatkę i dobierze notowanie, jeśli go nie podasz.</span></span><input type="checkbox" id="o-kom" checked></label>

      <div class="seg n2" role="group" aria-label="Pokaż" style="grid-template-columns:repeat(2,1fr);margin-top:8px"><button type="button" data-ofil="aktywna" aria-pressed="${obsFilter !== "zamknieta"}">Obserwuję (${nAct})</button><button type="button" data-ofil="zamknieta" aria-pressed="${obsFilter === "zamknieta"}">Zakończone (${S.obs.length - nAct})</button></div>
      <div>${list.map(obsItem).join("") || `<p class="note" style="padding-top:10px">${obsFilter === "zamknieta" ? "Nic jeszcze nie zakończyłeś." : "Na razie pusto. Dodaj pierwszą rzecz do obserwacji albo poczekaj na obserwacje Claude w raporcie tygodnia."}</p>`}</div>

  function wireObs() {
    const el = $("#obs"); if (!el) return;
    const find = id => S.obs.find(o => o._id === id);

    el.querySelectorAll("[data-osym]").forEach(b => b.onclick = async () => { const o = find(b.dataset.osym), t = prompt("Symbol notowania z Yahoo Finance, np. URA, GC=F, ^GSPC:", o?.symbol || ""); if (!o || t == null || !t.trim()) return; try { await put(o, { symbol: t.trim().toUpperCase(), start: null, ostatnio: null, kontrole: {}, blad_symbolu: false }); } catch (err) { b.textContent = writeErr(err); } });
    el.querySelectorAll("[data-oend]").forEach(b => b.onclick = async () => { const o = find(b.dataset.oend), t = prompt("Wniosek jednym zdaniem: czego nauczyła Cię ta obserwacja?"); if (!o || t == null) return; try { await put(o, { status: "zamknieta", zamknieto: today(), wniosek: t.trim() }); } catch (err) { b.textContent = writeErr(err); } });
    el.querySelectorAll("[data-odel]").forEach(b => b.onclick = async () => { if (!confirm("Usunąć tę obserwację?")) return; try { await db.doc("obserwacje/" + b.dataset.odel).delete(); } catch (err) { b.textContent = writeErr(err); } });
  }

  /* ---------- Raporty (with analysis and theses) ---------- */
  function renderRaporty(c) {
    const el = $("#v-raporty");
    const chrono = [...S.raporty].sort((a, b) => a.data.localeCompare(b.data));
    const tezy = Object.entries(S.plan?.tezy || {});
    const lastA = S.analizy[0];
    el.innerHTML = `<div style="display:grid;gap:18px">
      <div class="card"><header><h2>Analiza portfela</h2><span class="note">${lastA ? "ostatnia " + esc(lastA.data) : "jeszcze nie było"}</span></header>
        <p class="note">Claude czyta plan, pozycje, budżet z 3 miesięcy, cele, tezy i ostatni raport. Ocenia kierunek i pokazuje, co warto sprawdzić. Nie mówi, co kupić. Zużywa Twój limit Claude.</p>
        <div class="actions">${sample ? `<button class="btn" type="button" id="ai-go" ${aiBusy ? "disabled" : ""}>Poproś o analizę</button>${aiBusy ? '<button class="btn ghost" type="button" id="ai-stop">Zatrzymaj</button>' : ""}` : (window.PortfelBackend ? '<button class="btn" type="button" id="ai-copy">Skopiuj dane do analizy</button><span class="note">Wklej je w aplikacji Claude i wyślij.</span>' : '<span class="note">Analiza działa po otwarciu strony w Claude.</span>')}<span class="note" id="ai-msg" role="status">${esc(aiErr)}</span></div>
        <div class="md" id="ai-out">${aiText ? md(aiText) : lastA ? md(lastA.tresc) : ""}</div></div>
      ${monthCard(sumMonth)}
      <div class="card"><header><h2>Raporty dzienne</h2><span class="note">pn–pt rano, automatycznie</span></header>
        ${S.dzienne.length ? S.dzienne.slice(0, 10).map((r, i) => `<details class="more" ${i === 0 ? "open" : ""}><summary>${esc(r.tytul || "Raport dzienny")} <span class="note mono">${esc(r.data)}</span></summary><div class="actions" style="margin:4px 0 8px">${listenBtn("dzienne", r)}</div><div class="md">${md(r.tresc)}</div></details>`).join("") : '<p class="note">Pierwszy raport dzienny pojawi się w najbliższy dzień roboczy rano.</p>'}</div>
      <div class="card"><header><h2>Raporty tygodniowe</h2><span class="note">soboty, automatycznie</span></header>
        ${S.raporty.length ? S.raporty.map((r, i) => `${i === 0 && r.podsumowanie ? `<div class="md">${md(r.podsumowanie)}</div><div class="actions" style="margin:6px 0 4px">${listenBtn("raporty", r)}</div>` : ""}<details class="more"><summary>${esc(r.tytul || "Raport")} <span class="note mono">${esc(r.data)}</span></summary><div class="actions" style="margin:4px 0 8px">${listenBtn("raporty", r)}</div><div class="md">${md(r.tresc)}</div></details>`).join("") : '<div class="empty"><strong>Nie ma jeszcze raportów.</strong><span>W czacie napisz „raport tygodnia”. Zapisze się tutaj.</span></div>'}</div>
      <div class="card"><header><h2>Tezy</h2><span class="note">zmieniają się przez fakty, nie przez kurs</span></header>
        ${tezy.map(([k, t]) => { const hist = chrono.filter(r => r.tezy?.[k]).map(r => r.tezy[k]); const draft = /^SZKIC/.test(t.kiedy_sie_myle || ""); return `<details class="more"><summary><span>${esc(S.plan.role[k]?.nazwa || k)}</span>${statusPill(hist[hist.length - 1])}</summary>
          <div style="display:grid;gap:8px"><p>${esc(t.teza)}</p><div><span class="label">Co obserwuję</span><ul style="margin:4px 0 0;padding-left:18px">${(t.co_obserwowac || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div><span class="label">Kiedy się mylę</span> ${draft ? '<span class="pill warn">szkic</span>' : ""}<p>${esc((t.kiedy_sie_myle || "").replace(/^SZKIC do zatwierdzenia:\s*/, ""))}</p></div></div></details>`; }).join("") || '<p class="note">Brak tez.</p>'}</div>
      ${journalCard()}
      ${obsCard()}
      ${S.analizy.length > 1 ? `<details class="more card"><summary>Wcześniejsze analizy (${S.analizy.length - 1})</summary>${S.analizy.slice(1).map(a => `<details class="more"><summary>${esc(a.data)}</summary><div class="md">${md(a.tresc)}</div></details>`).join("")}</details>` : ""}
    </div>`;
    wireJournal(); wireObs();
    $("#ms-prev")?.addEventListener("click", () => { sumMonth = shiftMonth(sumMonth, -1); renderRaporty(calc()); $("#month-sum").scrollIntoView({ block: "nearest" }); });
    $("#ms-next")?.addEventListener("click", () => { sumMonth = shiftMonth(sumMonth, 1); renderRaporty(calc()); $("#month-sum").scrollIntoView({ block: "nearest" }); });

    $("#ai-copy")?.addEventListener("click", async () => {

      catch (e) { $("#ai-out").innerHTML = `<textarea readonly style="min-height:160px">${esc(text)}</textarea>`; $("#ai-out textarea").select(); $("#ai-msg").textContent = "Zaznaczone: skopiuj ręcznie."; }

  /* ---------- monthly summary: computed from the app's own data, for any month ---------- */
  let sumMonth = +today().slice(8) <= 10 ? shiftMonth(curMonth(), -1) : curMonth();
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  function monthSummary(m) {
    const first = m + "-01", last = shiftMonth(m, 1) + "-01";
    const inM = d => d >= first && d < last;
    const buys = S.tx.filter(t => inM(t.data || "") && !t.otwarcie && !isSell(t)), sells = S.tx.filter(t => inM(t.data || "") && isSell(t));
    const etfIn = buys.reduce((s, t) => s + (+t.kwota_pln || 0), 0), etfOut = sells.reduce((s, t) => s + (+t.kwota_pln || 0), 0);
    const ike = buys.filter(t => t.konto === "IKE").reduce((s, t) => s + (+t.kwota_pln || 0), 0);
    const h = [...S.historia].sort((a, b) => a.data.localeCompare(b.data));
    const at = d => h.filter(p => p.data < d).pop(), inside = h.filter(p => inM(p.data));
    const startP = at(first) || inside[0], endP = inside[inside.length - 1];
    const etfD = startP && endP && endP !== startP ? endP.wartosc - startP.wartosc : null;
    const rynek = etfD != null ? etfD - (etfIn - etfOut) : null;
    const majD = startP?.majatek != null && endP?.majatek != null && endP !== startP ? endP.majatek - startP.majatek : null;
    const b = monthSum(m), bp = monthSum(shiftMonth(m, -1));
    const lim = limits(), over = Object.entries(b.byCat).filter(([k, v]) => +lim[k] && v > +lim[k]);
    const topCat = Object.entries(b.byCat).sort((a, c) => c[1] - a[1]).slice(0, 3);
    const dz = S.dziennik.filter(j => inM(j.data || ""));
    const done = S.przeglad?.miesiac === m ? Object.values(S.przeglad.kroki || {}).filter(Boolean).length : null;
    return { m, etfIn, etfOut, ike, etfD, rynek, majD, startP, endP, b, bp, over, topCat, dz, done, any: !!(buys.length || sells.length || b.e.length || inside.length) };
  }
  function monthCard(m) {
    const x = monthSummary(m), cur = m === curMonth(), goal = +(S.plan?.profil?.cel_kwota || 0);
    const rate = x.b.przychod ? x.b.odlozone / x.b.przychod * 100 : null, rateP = x.bp.przychod ? x.bp.odlozone / x.bp.przychod * 100 : null;
    const li = (ic, html) => `<li><span class="ic ${ic}">${ic === "ok" ? "✓" : ic === "warn" ? "!" : "i"}</span><div>${html}</div><span></span></li>`;
    const rows = [];
    if (x.etfIn || x.etfOut) rows.push(li("ok", `Na ETF-y: <strong>${zl(x.etfIn)}</strong>${x.ike ? ` (w tym IKE ${zl(x.ike)})` : ""}${x.etfOut ? ` · sprzedaż ${zl(x.etfOut)}` : ""}`));
    else if (S.plan) rows.push(li("info", cur ? "Wpłaty na ETF-y w tym miesiącu jeszcze nie zapisałeś." : "W tym miesiącu nie było zapisanych zakupów ETF."));
    if (x.etfD != null) rows.push(li("info", `ETF-y: <strong class="${cls(x.etfD)}">${szl(x.etfD)}</strong>, z czego wpłaty ${szl(x.etfIn - x.etfOut)}, a rynek <span class="${cls(x.rynek)}">${szl(x.rynek)}</span>`));
    if (x.majD != null) rows.push(li("info", `Cały majątek: <strong class="${cls(x.majD)}">${szl(x.majD)}</strong>${goal && x.endP?.majatek ? ` · ${pct(x.endP.majatek / goal * 100, 0, false)} celu` : ""}`));
    if (x.b.przychod) rows.push(li(rate >= 20 ? "ok" : "info", `Budżet: przychody ${zl(x.b.przychod)}, wydatki ${zl(x.b.wydatek)}, odłożone ${zl(x.b.odlozone)} · <strong>oszczędzasz ${pct(rate, 0, false)}</strong>${rateP != null ? ` (miesiąc wcześniej ${pct(rateP, 0, false)})` : ""}`));
    if (x.topCat.length) rows.push(li("info", `Najwięcej wydałeś na: ${x.topCat.map(([k, v]) => `${esc(k)} ${zl(v)}`).join(", ")}`));
    if (x.over.length) rows.push(li("warn", `Przekroczone limity: ${x.over.map(([k, v]) => `${esc(k)} o ${zl(v - limits()[k])}`).join(", ")}`));
    if (x.dz.length) rows.push(li("info", `Dziennik: ${x.dz.length} ${x.dz.length === 1 ? "decyzja" : x.dz.length < 5 ? "decyzje" : "decyzji"}${x.dz.some(j => ["strach", "fomo", "chciwosc"].includes(j.emocja)) ? ", w tym podjęte w emocjach: warto je przeczytać" : ""}`));
    if (x.done != null) rows.push(li(x.done >= 6 ? "ok" : "info", `Przegląd miesiąca: ${x.done} z 6 kroków`));
    return `<div class="card" id="month-sum"><header><h2>Podsumowanie miesiąca</h2><span class="note">z Twoich danych</span></header>
      <div class="monthnav"><button type="button" id="ms-prev" aria-label="Poprzedni miesiąc">‹</button><strong>${esc(cap(monthName(m)))}</strong>${cur ? '<span class="note">do dziś</span>' : ""}<button type="button" id="ms-next" aria-label="Następny miesiąc" ${cur ? "disabled" : ""}>›</button></div>
      ${x.any ? `<ul class="checks">${rows.join("")}</ul>${x.startP && x.endP && x.startP !== x.endP ? `<p class="note">Wartości z ${esc(x.startP.data)} i ${esc(x.endP.data)} (punkty po aktualizacjach kursów).</p>` : '<p class="note">Zmiana majątku pojawi się, gdy w miesiącu będą co najmniej dwie aktualizacje kursów.</p>'}` : '<p class="note">Brak danych z tego miesiąca.</p>'}
    </div>`;
  }
  /* ---------- decision journal: why I did it and how I felt, read back months later next to what happened ---------- */
  const EMOCJE = [["spokoj", "Spokój"], ["pewnosc", "Pewność"], ["niepewnosc", "Niepewność"], ["strach", "Strach"], ["fomo", "Boję się, że coś mi ucieknie"], ["chciwosc", "Chęć szybkiego zysku"]];
  const DZ_TYP = [["kupno", "Kupuję"], ["sprzedaz", "Sprzedaję"], ["plan", "Zmieniam plan"], ["nic", "Postanawiam nic nie robić"]];
  let jEmo = "spokoj", jTyp = "kupno";
  function journalCard() {
    const valueAt = d => { const h = S.historia.filter(x => x.data <= d).sort((a, b) => b.data.localeCompare(a.data))[0]; return h?.wartosc; };
    const now = calc().total;
    return `<div class="card" id="journal"><header><h2>Dziennik decyzji</h2><span class="note">${S.dziennik.length} wpisów</span></header>
      ${learn("Po co dziennik", "Zapisujesz jednym zdaniem, co robisz, dlaczego i co czujesz. Po kilku miesiącach widać, które decyzje podejmowałeś na spokojnie, a które w emocjach, i co z nich wyszło. To najszybszy sposób nauki na własnych błędach.")}
      ${S.canWrite ? `<div class="seg n2" role="group" aria-label="Decyzja" style="grid-template-columns:repeat(2,1fr)">${DZ_TYP.map(([v, l]) => `<button type="button" data-jtyp="${v}" aria-pressed="${jTyp === v}">${l}</button>`).join("")}</div>
      <div class="field"><label for="j-txt">Dlaczego? Jednym, dwoma zdaniami</label><textarea id="j-txt" rows="2" placeholder="np. Dokupuję rynki wschodzące, bo są najbardziej poniżej celu. Spadły o 8%, ale teza bez zmian."></textarea></div>

        const cell = v => { const x = String(v ?? ""); return /[";\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; };
        const num = v => v == null || v === "" ? "" : String(v).replace(".", ","); // Polish Excel reads 12,5
        const rows = [["rodzaj", "data", "typ", "kategoria / fundusz", "konto", "jednostki", "kwota_pln", "opis"],
          ...[...S.budzet].sort((a, b) => (a.data || "").localeCompare(b.data || "")).map(b => ["budżet", b.data, b.typ, b.kategoria, "", "", num(b.kwota), b.opis]),
          ...[...S.tx].sort((a, b) => (a.data || "").localeCompare(b.data || "")).map(t => ["zakup ETF", t.data, t.typ, fundIndex().name[t.isin] || t.isin, t.konto, num(t.jednostki), num(t.kwota_pln), t.uwagi])];
        download(`nku-budzet-i-zakupy-${today()}.csv`, "﻿" + rows.map(r => r.map(cell).join(";")).join("\r\n"), "text/csv");
      };
      $("#cfg-priv").onchange =e => saveCfg({ prywatny: e.target.checked });
      $("#cfg-calm").onchange = e => saveCfg({ spokojny: e.target.checked });
      $("#cfg-pay").onchange = e => { const v = Math.round(+e.target.value); saveCfg({ dzien_wyplaty: v >= 1 && v <= 31 ? v : null }); };
      $("#cfg-wpl").onchange = e => { const v = +e.target.value || 5000; try { localStorage.removeItem("portfel-wplata"); } catch (err) {} saveCfg({ wplata: v }); };

      <div class="field" style="max-width:220px"><label for="w-pr">Przegląd planu (data)</label><input id="w-pr" data-f="przeglad" type="date" value="${esc(P.przeglad)}"></div>
      ${W.nieDokup.length ? `<div class="setrow"><span class="label">Stare pozycje, których nie dokupuję</span><p class="note">${W.nieDokup.map(i => esc(KAT[i]?.nazwa || fundIndex().name[i] || i)).join(", ")}</p></div>` : ""}`;
    else if (step === "Obecny stan") { const funds = [...W.role.flatMap(r => r.fundusze), ...W.nieDokup.map(i => ({ isin: i, nazwa: KAT[i]?.nazwa || i }))].filter(f => f.isin); body = `
      ${S.tx.length ? "" : learn("Skąd wziąć te liczby", "Otwórz aplikację brokera i wejdź w portfel albo pozycje. „Wartość teraz” to bieżąca wartość funduszu w złotych, a „Zapłaciłem” to łączna kwota zakupu (u niektórych brokerów: cena otwarcia × liczba jednostek). Jeśli jeszcze nic nie masz, po prostu kliknij Dalej.", ["zakup"])}
      ${S.tx.length ? `<p class="note">Masz już ${S.tx.length} transakcji w aplikacji, więc ten krok możesz pominąć. Nowe zakupy dodasz czerwonym plusem.</p>` : `<p class="note">Wpisz fundusze, które już masz: obecną wartość i ile za nie zapłaciłeś (z aplikacji brokera). Jeśli zaczynasz od zera, pomiń ten krok.</p>`}
      ${W.otwarcie.map((o, i) => `<div class="fgrid"><div class="field" style="grid-column:span 2"><label for="o-f-${i}">Fundusz</label><select id="o-f-${i}" data-o="${i}" data-ok="isin"><option value="">—</option>${funds.map(f => `<option value="${esc(f.isin)}" ${f.isin === o.isin ? "selected" : ""}>${esc(f.nazwa)}</option>`).join("")}</select></div>
        <div class="field"><label for="o-k-${i}">Konto</label><select id="o-k-${i}" data-o="${i}" data-ok="konto">${["zwykle", "IKE", "IKZE"].map(k => `<option ${k === o.konto ? "selected" : ""}>${k}</option>`).join("")}</select></div>
        <div class="field"><label for="o-w-${i}">Wartość teraz (zł)</label><input id="o-w-${i}" data-o="${i}" data-ok="wartosc" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(o.wartosc)}"></div>
        <div class="field"><label for="o-c-${i}">Zapłaciłem (zł)</label><input id="o-c-${i}" data-o="${i}" data-ok="koszt" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(o.koszt)}"></div></div>`).join("")}
      <div class="actions"><button class="btn ghost" type="button" id="o-add2">Dodaj fundusz</button></div>`; }
    else { const ww = wWarnings(), start = calc().total || W.otwarcie.reduce((s, o) => s + (+o.wartosc || 0), 0), yrs = Math.max(0, (+P.cel_rok || 0) - new Date().getFullYear()), goal = +P.cel_kwota || 0;
      const sc = [["ostrożnie", .02], ["umiarkowanie", .04], ["optymistycznie", .06]].map(([l, r]) => [l, r, fv(start, +P.wplata || 0, r, yrs)]);
      body = `<div class="md">
      <h3>Cel</h3><p>${esc({ emerytura: "Emerytura", mieszkanie: "Mieszkanie / duży zakup", pomnazanie: "Pomnażanie" }[P.cel])}${goal ? `: ${zl(goal)}` : ""}, rok ${esc(P.cel_rok)} (${yrs} lat). Wpłata ${zl(+P.wplata)} miesięcznie, konta: ${esc(P.konta.join(", "))}, ${esc(P.broker)}.</p>
      <h3>Podział</h3><ul>${W.role.map(r => `<li>${esc(r.nazwa)}: <strong>${nf(+r.cel || 0, 0)}%</strong> ± ${esc(r.pasmo)} pkt · ${esc(r.fundusze.map(f => f.nazwa).join(", ") || "brak funduszu")}${r.rdzen ? " · rdzeń" : ""}</li>`).join("")}</ul>
      <p>Średni koszt (TER) ok. <strong>${nf(ww.ter, 2)}%</strong> rocznie.</p>
      <h3>Zasady</h3><ul><li>Wyrównuję: ${esc({ wplaty: "nowymi wpłatami, dokupując to, co najbardziej poniżej celu", pasmo: "gdy waga wyjdzie poza pasmo", rok: "raz w roku" }[P.rebalans])}.</li>${P.przy_spadku ? `<li>Przy spadku: ${esc(P.przy_spadku)}</li>` : ""}${P.zmiana_planu ? `<li>Zmieniam plan: ${esc(P.zmiana_planu)}</li>` : ""}<li>Przegląd planu: ${esc(P.przeglad)}.</li></ul>
      ${yrs ? `<h3>Ile może być w ${esc(P.cel_rok)}</h3><p class="note">Ilustracja przy stałych wpłatach i założonej rocznej stopie po inflacji. To założenia, nie prognoza: rzeczywiste wyniki będą inne i mogą być ujemne.</p><ul>${sc.map(([l, r, v]) => `<li>${l} (${nf(r * 100, 0)}% rocznie): <strong>${zl(v)}</strong>${goal ? (v >= goal ? " · cel osiągnięty" : ` · brakuje ${zl(goal - v)}`) : ""}</li>`).join("")}</ul>` : ""}
      </div>${ww.list.length ? `<ul class="checks">${ww.list.map(t => `<li><span class="ic warn">!</span><div>${esc(t)}</div><span></span></li>`).join("")}</ul>` : ""}
      <p class="note">Plan jest Twoją decyzją. Aplikacja tylko pilnuje, żebyś się go trzymał, i ostrzega o rzeczach, które łatwo przeoczyć.</p>`; }
    root.innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Mój plan" style="max-width:640px">
      <header style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><span class="label">${S.plan ? "Zmiana planu" : `Mój plan · krok ${wStep + 1} z ${W_STEPS.length}`}</span><h2>${esc(step)}</h2></div><button class="btn ghost" type="button" id="w-x">Zamknij</button></header>
      ${S.plan ? `<div class="catchips" role="group" aria-label="Przejdź do kroku">${W_STEPS.map((t, i) => `<button type="button" data-wjump="${i}" aria-pressed="${i === wStep}">${esc(t)}</button>`).join("")}</div><p class="note" style="margin:0">Wybierz, co chcesz zmienić. Reszta planu zostaje bez zmian.</p>` : `<div class="progress"><div style="width:${(wStep + 1) / W_STEPS.length * 100}%"></div></div>`}
      ${body}
      <div class="actions" style="justify-content:space-between">${wStep ? '<button class="btn ghost" type="button" id="w-back">Wstecz</button>' : "<span></span>"}${wStep < W_STEPS.length - 1 ? (S.plan ? '<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" type="button" id="w-next">Dalej</button><button class="btn" type="button" id="w-save">Zapisz zmiany</button></span>' : '<button class="btn" type="button" id="w-next">Dalej</button>') : `<button class="btn" type="button" id="w-save">${S.plan ? "Zapisz zmiany" : "Zapisz plan"}</button>`}</div>
      <p class="note" id="w-msg" role="status"></p></div></div>`;
    if (wRestored) { $("#w-msg").innerHTML = 'Wróciłeś do niedokończonego planu. <button class="link" type="button" id="w-fresh">Zacznij od nowa</button>'; $("#w-fresh").onclick = () => { if (!armed($("#w-fresh"), "Na pewno? Kliknij jeszcze raz")) return; dropDraft(); openWizard(true); }; wRestored = false; }
    saveDraft();
    root.querySelectorAll("[data-wjump]").forEach(b => b.onclick = () => { wStep = +b.dataset.wjump; drawWizard(); $("#sheet-bg .sheet").scrollTop = 0; });
    // inputs
    root.querySelectorAll("[data-f]").forEach(el => el.addEventListener("input", () => { P[el.dataset.f] = el.value; }));
    root.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { P[b.dataset.p] = b.dataset.v; drawWizard(); });
    root.querySelectorAll("[data-konto]").forEach(b => b.onclick = () => { const k = b.dataset.konto; P.konta = P.konta.includes(k) ? P.konta.filter(x => x !== k) : [...P.konta, k]; drawWizard(); });
    root.querySelectorAll("[data-w]").forEach(el => el.addEventListener("input", () => { W[el.dataset.w] = el.value; }));
    root.querySelectorAll("[data-pod]").forEach(el => el.addEventListener("input", () => { W.poduszka[el.dataset.pod] = el.value; }));
    root.querySelectorAll("[data-podx]").forEach(b => b.onclick = () => { W.poduszka.cel = Math.round(+W.wydatki * +b.dataset.podx / 100) * 100; drawWizard(); });
    root.querySelectorAll("[data-tpl]").forEach(b => b.onclick = () => { applyTpl(b.dataset.tpl); drawWizard(); });
    root.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => {
      W.poziom = b.dataset.lv; saveCfg({ poziom: W.poziom });
      // starting points by level, only while the plan is still empty; weights and funds stay the user's choice
      if (!W.role.length || W._tplAuto) { W._tplAuto = true; applyTpl(W.poziom === "poczatkujacy" ? "jeden" : W.poziom === "sredni" ? "obl" : null); }
      if (W.poziom === "poczatkujacy") {
        P.przy_spadku ||= "Nie sprzedaję. Wpłacam dalej według planu. Sprawdzam, czy poduszka jest cała.";
        P.zmiana_planu ||= "Tylko gdy zmieni się mój cel, horyzont albo sytuacja życiowa. Nie z powodu wiadomości czy spadku.";
      }
      drawWizard();
    });
    root.querySelectorAll("[data-r]").forEach(el => el.addEventListener("change", () => { const r = W.role[+el.dataset.r]; r[el.dataset.k] = el.dataset.k === "nazwa" ? el.value : (el.value === "" ? "" : +el.value); drawWizard(); }));
    root.querySelectorAll("[data-rf]").forEach(el => el.addEventListener("change", () => { const r = W.role[+el.dataset.rf]; if (el.value === "inny") { r._inny = true; r.fundusze = []; } else { r._inny = false; r.fundusze = el.value ? [{ isin: el.value, nazwa: KAT[el.value].nazwa }] : []; } drawWizard(); }));
    root.querySelectorAll("[data-ri]").forEach(el => el.addEventListener("change", () => { const r = W.role[+el.dataset.ri], v = el.value.trim().toUpperCase(); if (!ISIN_RE.test(v)) { $("#w-msg").textContent = "ISIN ma 12 znaków, np. IE00B4L5Y983."; return; } r.fundusze = [{ isin: v, nazwa: r.fundusze[0]?.nazwa || v }]; drawWizard(); }));
    root.querySelectorAll("[data-rn]").forEach(el => el.addEventListener("change", () => { const r = W.role[+el.dataset.rn]; if (r.fundusze[0]) r.fundusze[0].nazwa = el.value.trim() || r.fundusze[0].isin; }));
    root.querySelectorAll("[data-rr]").forEach(el => el.addEventListener("change", () => { W.role[+el.dataset.rr].rdzen = el.checked; drawWizard(); }));
    root.querySelectorAll("[data-rdel]").forEach(b => b.onclick = () => { W.role.splice(+b.dataset.rdel, 1); drawWizard(); });
    $("#r-add")?.addEventListener("click", () => { W.role.push({ key: "", nazwa: "", cel: "", rdzen: false, pasmo: 3, fundusze: [] }); drawWizard(); });
    root.querySelectorAll("[data-t]").forEach(el => el.addEventListener("input", () => { const k = el.dataset.t; W.tezy[k] ||= {}; W.tezy[k][el.dataset.tk] = el.dataset.tk === "co_obserwowac" ? el.value.split(",").map(s => s.trim()).filter(Boolean) : el.value; }));
    root.querySelectorAll("[data-o]").forEach(el => ["input", "change"].forEach(ev => el.addEventListener(ev, () => { W.otwarcie[+el.dataset.o][el.dataset.ok] = el.value; saveDraft(); })));
    root.querySelectorAll("[data-r]").forEach(el => el.addEventListener("input", () => { const r = W.role[+el.dataset.r]; r[el.dataset.k] = el.dataset.k === "nazwa" ? el.value : (el.value === "" ? "" : +el.value); saveDraft(); }));
    root.querySelectorAll("[data-f],[data-w],[data-pod],[data-t]").forEach(el => el.addEventListener("input", () => setTimeout(saveDraft)));
    $("#o-add2")?.addEventListener("click", () => { W.otwarcie.push({ isin: "", konto: "zwykle", wartosc: "", koszt: "" }); drawWizard(); });
    $("#w-x").onclick = () => { saveDraft(); closeWizard(); $("#notice").textContent = "Plan zapisany jako szkic: dokończysz go w Portfelu albo na Starcie: przycisk Zmień plan."; $("#notice").hidden = !!S.plan; };
    $("#w-back")?.addEventListener("click", () => { wStep--; drawWizard(); $(".sheet").scrollTop = 0; });
    $("#w-next")?.addEventListener("click", () => {
      if (W_STEPS[wStep] === "Twój poziom" && !W.poziom) { $("#w-msg").textContent = "Wybierz poziom, żeby przejść dalej."; return; }
      if (W_STEPS[wStep] === "Podział") { const e = splitError(); if (e) { $("#w-msg").textContent = e; return; } W._tplAuto = false; }
      wStep++; drawWizard(); $(".sheet").scrollTop = 0;
    });
    // saving from any step still needs a valid split: otherwise jump to it and say what is missing
    $("#w-save")?.addEventListener("click", () => { const e = splitError(); if (e) { wStep = W_STEPS.indexOf("Podział"); drawWizard(); $("#w-msg").textContent = e; return; } saveWizard(); });
  }
  function splitError() {
    const ww = wWarnings();
    if (!W.role.length) return "Dodaj przynajmniej jedną rolę.";
    if (Math.abs(ww.sum - 100) > 0.01) return `Wagi muszą dać razem 100% (teraz ${nf(ww.sum, 1)}%).`;
    if (W.role.some(r => !r.fundusze.length)) return "Każda rola potrzebuje funduszu.";
    return "";
  }
  function applyTpl(t) {
    W.role = t === "jeden" ? [{ key: "rdzen", nazwa: "Rdzeń: cały świat", cel: 100, rdzen: true, pasmo: 5, fundusze: [] }]
      : t === "rdzen" ? [{ key: "rdzen", nazwa: "Rdzeń: świat", cel: "", rdzen: true, pasmo: 5, fundusze: [] }, { key: "", nazwa: "Satelita 1", cel: "", rdzen: false, pasmo: 3, fundusze: [] }, { key: "", nazwa: "Satelita 2", cel: "", rdzen: false, pasmo: 3, fundusze: [] }]
      : t === "obl" ? [{ key: "rdzen", nazwa: "Rdzeń: świat", cel: "", rdzen: true, pasmo: 5, fundusze: [] }, { key: "", nazwa: "Złoto", cel: "", rdzen: false, pasmo: 3, fundusze: [] }]
      : [];
  }
  function closeWizard() { W = null; closeSheet(); }
  async function saveWizard() {
    const btn = $("#w-save"); btn.disabled = true; $("#w-msg").textContent = "Zapisuję…";
    const old = S.plan || {}, P = W.profil;
    const used = new Set(), role = {}, notowania = { ...(old.notowania || {}) };
    let coreTaken = false;
    for (const r of W.role) {
      let key = r.rdzen && !coreTaken ? "rdzen" : (r.key && r.key !== "rdzen" ? r.key : slug(r.nazwa));
      if (key === "rdzen") coreTaken = true;
      while (used.has(key)) key += "_2";
      used.add(key);
      const fundusze = Object.fromEntries(r.fundusze.map(f => [f.isin, f.nazwa]));
      for (const i of W.nieDokup) if ((old.role?.[r.key]?.fundusze || {})[i]) fundusze[i] = old.role[r.key].fundusze[i]; // keep old positions visible in their role
      role[key] = { nazwa: r.nazwa || "Rola", cel: +r.cel || 0, pasmo: +r.pasmo || 0, rdzen: !!r.rdzen, fundusze };
      for (const f of r.fundusze) if (KAT[f.isin]) notowania[f.isin] ||= KAT[f.isin].yahoo;
      if (r.key && r.key !== key && W.tezy[r.key]) { W.tezy[key] = W.tezy[r.key]; }
    }
    const tezy = {};
    for (const [k, t] of Object.entries(W.tezy)) if (role[k] && !role[k].rdzen && (t.teza || t.kiedy_sie_myle)) tezy[k] = t;
    const nowy = { ...old, opis: "Plan ustawiony w aplikacji. Wagi i tezy ustala właściciel.", ustalono: today(),
      rdzen_satelity: `${nf(Object.values(role).filter(r => r.rdzen).reduce((s, r) => s + r.cel, 0), 0)}/${nf(Object.values(role).filter(r => !r.rdzen).reduce((s, r) => s + r.cel, 0), 0)}`,
      role, nie_dokupujemy: W.nieDokup, notowania, wskazniki: old.wskazniki || DEFAULT_WSK, tezy,
      profil: { ...P, wplata: +P.wplata || 0, cel_kwota: +P.cel_kwota || 0, cel_rok: +P.cel_rok || 0, wydatki: +W.wydatki || 0, bezpieczny: W.bezpieczny === "" ? "" : +W.bezpieczny } };
    const ce = S.cele || {}, rok = new Date().getFullYear();
    const cele = { ...ce, poduszka: { cel: +W.poduszka.cel || 0, zebrane: +W.poduszka.zebrane || 0 },
      limity: ce.limity?.rok === rok ? ce.limity : { rok, ike: 28260, ikze: 11304, ike_wplacone: 0, ikze_wplacone: 0, ...(ce.limity?.rok === rok ? ce.limity : {}) },
      obligacje: ce.obligacje || [] };
    try {
      await db.doc("app/plan").set(nowy);
      await db.doc("app/cele").set(cele);
      for (const o of W.otwarcie) {
        if (!o.isin || !(+o.wartosc > 0)) continue;
        const p = S.stan?.ceny?.[o.isin];
        await db.collection("transakcje").add({ data: today(), konto: o.konto, isin: o.isin, ticker_xtb: "", typ: "kupno",
          jednostki: p ? +(+o.wartosc / p.pln).toFixed(6) : null, cena: null, waluta: p?.waluta || "", kwota_pln: +o.koszt || +o.wartosc,
          wartosc_otwarcia_pln: +o.wartosc, otwarcie: true, do_przeliczenia: !p, uwagi: "stan otwarcia z kreatora planu" });
      }
      if (+P.wplata) await saveCfg({ wplata: +P.wplata });
      dropDraft(); closeWizard(); show("start");
    } catch (e) { $("#w-msg").textContent = writeErr(e); btn.disabled = false; }
  }

  /* ---------- render and data ---------- */
  function renderAll() {
    const c = calc();
    const asof = S.stan?.asOf;
    $("#asof").textContent = asof ? "kursy z " + asof.slice(8, 10) + "." + asof.slice(5, 7) : (S.loaded.stan ? "brak kursów" : "wczytuję…");
    renderStart(c); renderBudzet(); renderPortfel(c); renderCele(); renderWiedza();
    if (!aiBusy) renderRaporty(c);
    maybeSnapshot(c); syncListen();
    // a new person without a plan gets the wizard once, right after their data has loaded
    // a new person sees the short tour first, then the plan wizard
    if (!wizShown && db && S.canWrite && S.loaded.plan && S.loaded.tx && !S.plan && !sheet) { wizShown = true; if (CFG.przewodnik) openWizard(); else openTour(); }
    if (wantWplata && db && S.loaded.plan && S.loaded.tx && S.loaded.stan && S.plan && !sheet) { wantWplata = false; history.replaceState(null, "", location.pathname + "#portfel"); openWplata(); }
  }
  // one history point per price update, written by the owner's view when it first sees new prices
  // one history point per price update; the latest one follows edits (a deleted or added purchase rewrites it), older ones stay as they were
  async function maybeSnapshot(c) {
    if (!db || !S.canWrite || !S.loaded.historia || !S.loaded.tx || !S.stan?.asOf || !c.list.length) return;
    const id = S.stan.asOf.slice(0, 10), pod = Math.round(+(S.cele?.poduszka?.zebrane || 0)), obl = Math.round(bondsValue());
    const pt = { data: id, wartosc: Math.round(c.total), wplacono: Math.round(c.wplacono), obligacje: obl, poduszka: pod, majatek: Math.round(c.total) + obl + pod };
    const key = JSON.stringify(pt);
    if (snapWritten === key) return;
    const have = S.historia.find(h => h._id === id);
    if (have && ["wartosc", "wplacono", "majatek"].every(k => Math.abs((have[k] ?? -1e9) - pt[k]) < 2)) { snapWritten = key; return; }
    if (S.historia.some(h => h.data > id)) { snapWritten = key; return; } // an older price date: never rewrite the past
    snapWritten = key;
    try { await db.doc("historia/" + id).set(pt); } catch (e) {}
  }
  let rq = false;
  const queue = () => { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; if (!sheet) renderAll(); else pendingRender = true; }); };
  let pendingRender = false;
  setInterval(() => { if (pendingRender && !sheet) { pendingRender = false; renderAll(); } }, 500);
  renderAll();

  (async () => {
    const timer = setTimeout(() => { const n = $("#notice"); n.textContent = "Dane jeszcze się nie wczytały. Strona spróbuje dalej sama."; n.hidden = false; }, 10000);
    const ok = () => { clearTimeout(timer); $("#notice").hidden = true; };
    try { db = await window.PortfelBackend.connect(); } catch (e) { db = null; }
    if (!db) { clearTimeout(timer); const n = $("#notice"); n.textContent = "Nie udało się połączyć z bazą. Sprawdź internet i odśwież aplikację."; n.hidden = false; $("#asof").textContent = ""; return; }
    const user = null;
    if (user) { const can = await user.can?.("data.write"); if (can === false) S.canWrite = false; }
    const fail = () => { clearTimeout(timer); const n = $("#notice"); n.textContent = "Nie udało się wczytać danych. Odśwież stronę później."; n.hidden = false; };
    const docSub = (path, key) => db.doc(path).onSnapshot(s => { S[key] = s.exists ? s.data() : null; if (!s.metadata.fromCache) { S.loaded[key] = true; ok(); } queue(); }, fail);
    db.doc("app/ustawienia").onSnapshot(s => { if (s.exists) { CFG = { ...DEFAULT_CFG, ...s.data() }; applyCfg(); queue(); } }, () => {});
    docSub("app/plan", "plan"); docSub("app/wiedza", "wiedza"); docSub("app/dzien", "dzien"); docSub("app/stan", "stan"); docSub("app/cele", "cele"); docSub("app/budzet", "budzetCfg"); docSub("przeglad/" + curMonth(), "przeglad");
    const colSub = (q, key) => q.onSnapshot(s => { S[key] = s.docs.map(d => ({ _id: d.id, ...d.data() })); if (!s.metadata.fromCache) S.loaded[key] = true; queue(); }, fail);
    colSub(db.collection("transakcje"), "tx");
    colSub(db.collection("raporty").orderBy("data", "desc").limit(60), "raporty");
    colSub(db.collection("analizy").orderBy("data", "desc").limit(30), "analizy");
    colSub(db.collection("historia"), "historia");
    colSub(db.collection("budzet").orderBy("data", "desc").limit(1000), "budzet");
    colSub(db.collection("dzienne").orderBy("data", "desc").limit(30), "dzienne");
    colSub(db.collection("dziennik").orderBy("data", "desc").limit(200), "dziennik");
    colSub(db.collection("obserwacje").orderBy("data", "desc").limit(200), "obs");
    sample = null;
    queue();
  })();
})();
