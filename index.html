<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4151f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NKU">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>NKU</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column, phone first. Start answers "is everything fine?", the rest is detail.
   Bottom bar on phones, top bar on wide screens, one red "+" for anything you need to write down. */
:root {
  --bg: #ffffff;
  --surface: #f4f2f0;
  --ink: #111111;
  --muted: #6b6866;
  --line: #dedad6;
  --red: #d4151f;          /* brand: actions, the active tab, the "+" */
  --red-soft: #fbe6e6;
  --on-red: #ffffff;
  --up: #0b6b40;           /* gains (darker for contrast on grey cards) */
  --up-soft: #e2f3ea;
  --down: #c2171f;         /* losses (always with a minus sign) */
  --warn: #9a6200;
  --warn-soft: #fbf0d9;
  --info-soft: #eeeceb;
  --f-display: "Archivo", "Arial Narrow", "Segoe UI", sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --surface: #161616; --ink: #f4f2f1; --muted: #a29e9b; --line: #2a2827;
    --red: #ff3b3f; --red-soft: #3a1214; --on-red: #0b0b0b;
    --up: #45c98a; --up-soft: #12301f; --down: #ff6a64; --warn: #f0b545; --warn-soft: #33270e; --info-soft: #1f1e1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0b; --surface: #161616; --ink: #f4f2f1; --muted: #a29e9b; --line: #2a2827;
  --red: #ff3b3f; --red-soft: #3a1214; --on-red: #0b0b0b;
  --up: #45c98a; --up-soft: #12301f; --down: #ff6a64; --warn: #f0b545; --warn-soft: #33270e; --info-soft: #1f1e1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.mono, td.n { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.note { font-size: 0.84rem; color: var(--muted); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.up { color: var(--up); } .down { color: var(--down); }

/* top bar */
header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; flex: none; }
#asof { font-size: 0.8rem; color: var(--muted); text-align: right; }

/* navigation: five equal tabs at the bottom, kept compact on wide screens; the red "+" floats just above the bar on the right */
.sidebrand, .sideadd { display: none; }
.navwrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabbar { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: center; }
nav.tabbar button[role=tab] { background: none; border: 0; height: var(--nav-h); min-width: 0; display: grid; place-items: center; align-content: center; gap: 3px; padding: 6px 2px; color: var(--muted); font: 600 0.7rem var(--f-body); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav.tabbar button[role=tab] svg { width: 22px; height: 22px; }
nav.tabbar button[aria-selected="true"] { color: var(--red); }

/* cards and blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.hero { padding: 6px 0 2px; display: grid; gap: 6px; }
.hero .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3rem); letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.82rem; padding: 4px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip b { font-weight: 700; font-family: var(--f-data); font-size: 0.8rem; color: var(--ink); }
.chip b.up { color: var(--up); } .chip b.down { color: var(--down); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-data); font-size: 1.15rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 0.78rem; color: var(--muted); }

/* status list */
.status-head { display: flex; align-items: center; gap: 12px; }
.status-head .mark { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 800; font-family: var(--f-display); }
.status-head .mark.ok { background: var(--up-soft); color: var(--up); }
.status-head .mark.todo { background: var(--red); color: var(--on-red); }
ul.checks { list-style: none; margin: 0; padding: 0; display: grid; }
ul.checks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
ul.checks li:first-child { border-top: 0; }
.ic { width: 18px; height: 18px; border-radius: 50%; margin-top: 3px; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.ic.ok { background: var(--up-soft); color: var(--up); }
.ic.todo { background: var(--red); color: var(--on-red); }
.ic.warn { background: var(--warn-soft); color: var(--warn); }
.ic.info { background: var(--info-soft); color: var(--muted); }
button.go { background: none; border: 0; color: var(--red); font: 600 0.86rem var(--f-body); cursor: pointer; padding: 2px 0; white-space: nowrap; }

/* monthly routine */
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--red); border-radius: 3px; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; }
ol.steps li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
ol.steps li:first-child { border-top: 0; }
ol.steps input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--red); margin: 0; }
ol.steps li.done span { color: var(--muted); text-decoration: line-through; }

/* bars */
.roles { display: grid; gap: 10px; }
.role { display: grid; gap: 4px; }
.role .row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.88rem; }
.bar { position: relative; height: 8px; background: var(--line); border-radius: 4px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ink); }
.bar .fill.red { background: var(--red); }
.bar .fill.warn { background: var(--warn); }
.bar .target { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--red); }

/* tables and lists */
.tablebox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.list { display: grid; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: 0; }
.item .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .s { font-size: 0.8rem; color: var(--muted); }
.item .a { font-family: var(--f-data); text-align: right; white-space: nowrap; }
details.more > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary .mono { white-space: nowrap; flex: none; margin-left: auto; padding-left: 8px; }
details.more > summary::after { content: "+"; color: var(--red); font-weight: 800; }
details.more[open] > summary::after { content: "−"; }
details.more[open] > summary { margin-bottom: 10px; }
.pill { display: inline-block; font-size: 0.74rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--up-soft); color: var(--up); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--red-soft); color: var(--down); }
.pill.plain { background: var(--info-soft); color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); display: grid; gap: 4px; font-size: 0.92rem; }
.empty strong { color: var(--ink); }
.md { display: grid; gap: 8px; max-width: 70ch; font-size: 0.95rem; }
.md ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.md h3 { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.md > h3:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.md strong { font-weight: 700; }
/* several reports in one card: a clear line between them */
.card > details.more + details.more { border-top: 1px solid var(--line); padding-top: 12px; }

/* forms */
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.fgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.card input, .card select { background: var(--bg); }
button.btn { font: 700 0.95rem var(--f-body); border-radius: 10px; padding: 11px 16px; border: 0; background: var(--red); color: var(--on-red); cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.btn:disabled { opacity: 0.5; cursor: default; }
button.link { background: none; border: 0; padding: 0; color: var(--down); font: inherit; font-size: 0.82rem; cursor: pointer; text-decoration: underline; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.notice { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
.monthnav { display: flex; align-items: center; gap: 8px; }
.monthnav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
.monthnav strong { font-family: var(--f-display); font-size: 1.05rem; min-width: 150px; text-align: center; text-transform: capitalize; }

/* the red "+" and the quick-add sheet */
.fab { position: fixed; z-index: 21; right: max(16px, env(safe-area-inset-right, 0px), calc(50% - 364px)); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--red); color: var(--on-red); display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.28); }
.fab svg { width: 24px; height: 24px; }
.fab:active { transform: scale(.95); }
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 92vh; overflow-y: auto; }
@media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
/* while a window is open, swiping down must scroll it, never pull-to-refresh the page (that would lose what was typed) */
.sheet { overscroll-behavior: contain; }
html:has(#sheet-root .sheet-bg), html:has(#sheet-root .sheet-bg) body { overscroll-behavior-y: contain; }
/* glossary: a "?" next to a term opens its explanation above whatever is open */
button.tip { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-left: 4px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--red); font: 800 0.72rem var(--f-body); cursor: pointer; vertical-align: middle; padding: 0; text-transform: none; letter-spacing: 0; }
.learn { background: var(--surface); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; padding: 10px 12px; display: grid; gap: 6px; font-size: 0.9rem; }
.learn strong.h { font-family: var(--f-display); }
#tip-root .sheet-bg { z-index: 50; }
.gloss { display: grid; gap: 4px; }
.gloss button { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 2px; font: 600 0.95rem var(--f-body); color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.gloss button::after { content: "›"; color: var(--red); }
.levels { display: grid; gap: 8px; }
.levels button { text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 12px 14px; cursor: pointer; font: inherit; display: grid; gap: 2px; }
.levels button[aria-pressed="true"] { border-color: var(--red); box-shadow: 0 0 0 1px var(--red) inset; }
.levels button strong { font-family: var(--f-display); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 9px 4px; border-radius: 8px; font: 700 0.82rem var(--f-body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.amount { font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; text-align: center; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; background: transparent; padding: 6px 0; }
.amount:focus { border-bottom-color: var(--red); outline: none; }
.catchips { display: flex; flex-wrap: wrap; gap: 6px; }
.catchips button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: 600 0.84rem var(--f-body); cursor: pointer; }
.catchips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
svg text { fill: var(--muted); font-family: var(--f-data); font-size: 11px; }
.topright { display: flex; align-items: center; gap: 4px; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: none; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn[aria-pressed="true"] { color: var(--red); }
.setrow { display: grid; gap: 6px; }
.seg.n2 { grid-template-columns: repeat(2, 1fr); } .seg.n3 { grid-template-columns: repeat(3, 1fr); }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.switch input { width: 22px; height: 22px; accent-color: var(--red); flex: none; }
/* privacy: amounts are blurred until you turn it off (handy in public) */
html.priv :is(.big, .chip b, .item .a, td.n, .mono, .md, ul.checks li > div, .kpi .v, #wpl-out) { filter: blur(7px); user-select: none; }
@media (prefers-reduced-motion: no-preference) { .bar .fill, .progress > div { transition: width .35s ease; } }
.subnav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -2px; }
.subnav::-webkit-scrollbar { display: none; }
.subnav button { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 600 0.86rem var(--f-body); cursor: pointer; white-space: nowrap; }
.subnav button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
[hidden] { display: none !important; }
/* the "+" slides away while scrolling down and comes back when scrolling up, so it never covers buttons */
.fab { transition: transform .2s ease, opacity .2s ease; }
.fab.away { transform: translateY(140%); opacity: 0; pointer-events: none; }
/* player: a slim bar above the bottom menu, it stays while you switch tabs */
.player { position: fixed; z-index: 22; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 16px)); display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--ink); color: var(--bg); border-radius: 14px; box-shadow: 0 8px 22px rgba(0,0,0,.3); }
.pl-btn { flex: none; min-width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; color: inherit; font: 700 0.8rem var(--f-data); cursor: pointer; display: grid; place-items: center; padding: 0 4px; }
.pl-btn:hover { background: rgba(127,127,127,.22); }
.pl-main { background: var(--red); color: var(--on-red); min-width: 44px; height: 44px; border-radius: 50%; }
.pl-main:hover { background: var(--red); filter: brightness(1.1); }
.pl-main svg { width: 20px; height: 20px; }
.pl-info { flex: 1; min-width: 0; display: grid; gap: 2px; padding: 0 4px; }
.pl-t { font: 600 0.82rem var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-s { font: 500 0.7rem var(--f-data); opacity: .75; }
.pl-info input[type=range] { width: 100%; height: 4px; margin: 2px 0; accent-color: var(--red); padding: 0; border: 0; background: transparent; }
body.playing .fab { bottom: calc(var(--nav-h) + 86px + env(safe-area-inset-bottom, 0px)); }
body.playing .wrap { padding-bottom: 170px; }
@media (max-width: 420px) { #pl-next { display: none; } .pl-btn { min-width: 34px; } }
button.listen { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 6px 12px 6px 8px; font: 600 0.84rem var(--f-body); cursor: pointer; }
button.listen svg { width: 18px; height: 18px; color: var(--red); }
button.listen[aria-pressed="true"] { border-color: var(--red); color: var(--red); }
.lesson-row { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.lesson-row:first-child { border-top: 0; }
.lesson-row .ic { grid-row: span 2; margin-top: 0; }
.lesson-row .t { font-weight: 600; }
.lesson-row .s { font-size: 0.8rem; color: var(--muted); }
.lesson-row:hover .t { color: var(--red); }
.obs-item { border-top: 1px solid var(--line); padding: 14px 0 4px; display: grid; gap: 8px; }
.obs-item:first-of-type { border-top: 0; }
.obs-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.obs-head strong { font-size: 1rem; }
.obs-checks { display: flex; flex-wrap: wrap; gap: 6px; }
.obs-note { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; font-size: 0.9rem; }
.obs-note.claude { border-left-color: var(--red); }
/* computer: the same app with a side menu and cards in two columns; phones keep the bottom bar */
@media (min-width: 1024px) {
  .player { left: calc(var(--side) + (100% - var(--side)) / 2); bottom: 18px; width: min(640px, calc(100% - var(--side) - 48px)); }
  body.playing .wrap { padding-bottom: 110px; }
  :root { --side: 236px; }
  body { padding-left: var(--side); }
  .wrap { max-width: 1240px; padding: 22px 32px 56px; }
  .navwrap { top: 0; bottom: 0; right: auto; width: var(--side); border-top: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 22px 14px 16px; }

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<script>
(() => {
  const S = { dzien: null, dziennik: [], plan: null, stan: null, cele: null, tx: [], raporty: [], dzienne: [], analizy: [], historia: [], budzet: [], budzetCfg: null, przeglad: null, obs: [], wiedza: null, loaded: {}, canWrite: true };
  let wizShown = false;
  let db = null, sample = null, snapWritten = false, aiCtl = null, aiText = "", aiBusy = false, aiErr = "";
  let bMonth = (d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"))(new Date());
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nf = (n, d = 0) => new Intl.NumberFormat("pl-PL", { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
  const zl = (n, d = 0) => (n == null || isNaN(n)) ? "–" : nf(n, d) + " zł";
  const szl = (n, d = 0) => (n == null || isNaN(n)) ? "–" : (n > 0 ? "+" : n < 0 ? "−" : "") + nf(Math.abs(n), d) + " zł";
  const pct = (n, d = 1, sign = true) => (n == null || isNaN(n)) ? "–" : (sign && n > 0 ? "+" : n < 0 ? "−" : "") + nf(Math.abs(n), d) + "%";
  const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
  // the local calendar day (toISOString is UTC: right after midnight it still said "yesterday")
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const curMonth = () => today().slice(0, 7);

  /* ---------- navigation ---------- */
  const views = ["start", "budzet", "portfel", "cele", "raporty", "wiedza"];
  function show(v) {
    if (!views.includes(v)) v = "start";
    for (const x of views) { $("#v-" + x).hidden = x !== v; $("#t-" + x).setAttribute("aria-selected", String(x === v)); }
    try { localStorage.setItem("portfel-tab", v); } catch (e) {}
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("nav.tabbar button[role=tab]").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));
  /* ---------- settings: kept in the database so phone and computer match, cached on the device for an instant start ---------- */
  const DEFAULT_CFG = { motyw: "system", tekst: "normalny", ekran: "start", prywatny: false, spokojny: false, wplata: 5000, glos: "zofia" };
  let CFG = { ...DEFAULT_CFG };
  try { CFG = { ...CFG, ...JSON.parse(localStorage.getItem("portfel-ust") || "{}") }; } catch (e) {}
  function applyCfg() {
    const root = document.documentElement;
    if (CFG.motyw === "jasny") root.setAttribute("data-theme", "light");
    else if (CFG.motyw === "ciemny") root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
    root.style.fontSize = CFG.tekst === "duzy" ? "112.5%" : "";
    document.body.style.fontSize = CFG.tekst === "duzy" ? "18px" : "";
    root.classList.toggle("priv", !!CFG.prywatny);
    $("#priv-btn").setAttribute("aria-pressed", String(!!CFG.prywatny));
    try { localStorage.setItem("portfel-ust", JSON.stringify(CFG)); } catch (e) {}
  }
  applyCfg();
  async function saveCfg(patch) {
    CFG = { ...CFG, ...patch };
    applyCfg(); queue();
    // only the changed fields: a device with older settings must not overwrite what was set on another one
    if (db && S.canWrite) { try { await db.doc("app/ustawienia").update(patch); } catch (e) { try { await db.doc("app/ustawienia").set(CFG); } catch (e2) {} } }
  }
  $("#priv-btn").addEventListener("click", () => saveCfg({ prywatny: !CFG.prywatny }));

  let first = (location.hash || "").slice(1), wantWplata = first === "wplata";
  if (wantWplata) first = "portfel";
  if (!views.includes(first)) {
    if (CFG.ekran !== "ostatnia") first = CFG.ekran;
    else { try { first = localStorage.getItem("portfel-tab") || "start"; } catch (e) { first = "start"; } }
  }
  show(first);
  document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) { const [v, extra] = g.dataset.go.split(":"); if (v === "add") openSheet(extra || "wydatek"); else if (v === "plan") openWizard(); else if (v === "wplata") openWplata(); else { if (extra) setSub(v, extra); show(v); } } });

  /* ---------- sub-pages: long tabs split into short pages (pills under the header) ---------- */
  const SUBS = {
    budzet: [["miesiac", "Podsumowanie", ["Wydatki", "Stałe opłaty", "Ostatnie miesiące"]], ["wpisy", "Wpisy i limity", ["Wpisy", "Limity"]]],
    portfel: [["przeglad", "Przegląd", ["Pozycje", "Wartość w czasie"]], ["wplata", "Wpłata", ["Następna wpłata"]], ["sklad", "Skład i ryzyko", ["Co mam w środku", "Test na kryzys", "Rynek w tym tygodniu"]], ["historia", "Historia", ["Historia transakcji"]]],
    cele: [["cele", "Cele", ["Cel", "Majątek w czasie", "Cele oszczędnościowe", "Poduszka", "Zapisz cele"]], ["konta", "IKE, obligacje, podatki", ["IKE", "Obligacje", "Podatki", "Zapisz cele"]], ["kalk", "Kalkulator", ["Kalkulator"]]],
    raporty: [["raporty", "Raporty", ["Raporty dzienne", "Raporty tygodniowe"]], ["miesiac", "Miesiąc", ["Podsumowanie miesiąca"]], ["tezy", "Tezy i dziennik", ["Tezy", "Dziennik decyzji"]], ["obs", "Obserwatorium", ["Obserwatorium"]], ["analiza", "Analiza", ["Analiza portfela", "Wcześniejsze analizy"]]]
  };
  let SUB = {};
  try { SUB = JSON.parse(localStorage.getItem("nku-sub") || "{}"); } catch (e) {}
  function setSub(view, key) { SUB[view] = key; try { localStorage.setItem("nku-sub", JSON.stringify(SUB)); } catch (e) {} applySub(view); window.scrollTo(0, 0); }
  function applySub(view) {
    const defs = SUBS[view], wrap = $("#v-" + view + " > div");
    if (!defs || !wrap) return;
    const cur = defs.some(d => d[0] === SUB[view]) ? SUB[view] : defs[0][0];
    let bar = wrap.querySelector(":scope > .subnav");
    if (!bar) {
      bar = document.createElement("div"); bar.className = "subnav"; bar.setAttribute("role", "tablist");
      bar.innerHTML = defs.map(([k, l]) => `<button type="button" role="tab" data-sub="${k}">${l}</button>`).join("");
      const after = wrap.querySelector(":scope > .hero, :scope > .monthnav");
      const anchor = wrap.querySelector(":scope > .hero") || after;
      anchor ? anchor.after(bar) : wrap.prepend(bar);
      bar.addEventListener("click", e => { const b = e.target.closest("[data-sub]"); if (b) setSub(view, b.dataset.sub); });
    }
    bar.querySelectorAll("[data-sub]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.sub === cur)));
    const title = el => (el.querySelector(":scope > header h2, :scope > summary, :scope > header h3") || el).textContent.trim();
    for (const el of wrap.children) {
      if (el === bar || el.matches(".hero, .monthnav, .notice")) continue;
      const t = title(el), owners = defs.filter(d => d[2].some(p => t.startsWith(p))).map(d => d[0]);
      el.hidden = owners.length ? !owners.includes(cur) : false;
    }
  }
  // every render replaces a tab's content: put the pills back and show the chosen page
  for (const v of Object.keys(SUBS)) new MutationObserver(() => applySub(v)).observe($("#v-" + v), { childList: true });

  /* ---------- portfolio calculations ---------- */
  function fundIndex() {
    const role = {}, name = {};
    if (!S.plan) return { role, name };
    for (const [r, d] of Object.entries(S.plan.role)) for (const [isin, n] of Object.entries(d.fundusze)) { role[isin] = r; name[isin] = n; }
    return { role, name };
  }
  const isSell = t => String(t.typ).startsWith("sprz");
  function calc() {
    const { role, name } = fundIndex();
    const ceny = S.stan?.ceny || {};
    const pos = {};
    const txs = [...S.tx].sort((a, b) => (a.data || "").localeCompare(b.data || ""));
    for (const t of txs) {
      const p = pos[t.isin] ||= { isin: t.isin, nazwa: name[t.isin] || t.isin, rola: role[t.isin] || "inne", jednostki: 0, koszt: 0, konta: {} };
      const u = +t.jednostki || 0, pln = +t.kwota_pln || 0;
      if (isSell(t)) { if (p.jednostki > 0) p.koszt -= p.koszt * Math.min(1, u / p.jednostki); p.jednostki -= u; p.konta[t.konto] = (p.konta[t.konto] || 0) - u; }
      else if (t.jednostki == null && t.wartosc_otwarcia_pln) { p.stat = (p.stat || 0) + +t.wartosc_otwarcia_pln; p.koszt += pln; p.konta[t.konto] = (p.konta[t.konto] || 0) + 1; } // units come with the first nightly price
      else { p.jednostki += u; p.koszt += pln; p.konta[t.konto] = (p.konta[t.konto] || 0) + u; }
    }
    const list = Object.values(pos).filter(p => p.jednostki > 1e-9 || p.stat > 0).map(p => {
      const c = ceny[p.isin];
      const wartosc = c || p.stat ? (c ? p.jednostki * c.pln : 0) + (p.stat || 0) : null;
      return { ...p, cena: c, wartosc, prev: c && !p.stat ? wartosc / (1 + c.tydz_pln_proc / 100) : wartosc };
    }).sort((a, b) => (b.wartosc || 0) - (a.wartosc || 0));
    const total = list.reduce((s, p) => s + (p.wartosc || 0), 0);
    const prevTotal = list.reduce((s, p) => s + (p.prev || 0), 0);
    const koszt = list.reduce((s, p) => s + p.koszt, 0);
    const wplacono = txs.reduce((s, t) => s + (isSell(t) ? -1 : 1) * (+t.kwota_pln || 0), 0);
    const roles = S.plan ? Object.entries(S.plan.role).map(([r, d]) => {
      const v = list.filter(p => p.rola === r).reduce((s, p) => s + (p.wartosc || 0), 0);
      const w = total ? v / total * 100 : 0;
      return { rola: r, nazwa: d.nazwa, cel: d.cel, wartosc: v, waga: w, odch: w - d.cel };
    }) : [];
    // an opening balance counts at its market value on the opening day, so the yearly rate
    // and the MSCI World comparison measure only what happened after it
    const flowPln = t => +(t.wartosc_otwarcia_pln ?? t.kwota_pln) || 0;
    const flows = txs.map(t => [t.data, isSell(t) ? flowPln(t) : -flowPln(t)]);
    if (total > 0) flows.push([S.stan?.asOf?.slice(0, 10) || today(), total]);
    const xirr = irr(flows);
    let bench = null;
    const ser = S.stan?.benchmark?.seria;
    if (ser?.length && txs.length) {
      const priceAt = d => { if (d <= ser[0][0]) return ser[0][1]; let lo = 0, hi = ser.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ser[m][0] <= d) lo = m; else hi = m - 1; } return ser[lo][1]; };
      let units = 0;
      for (const t of txs) units += (isSell(t) ? -1 : 1) * flowPln(t) / priceAt(t.data);
      bench = units * ser[ser.length - 1][1];
    }
    return { list, total, prevTotal, koszt, wplacono, roles, xirr, bench };
  }
  function irr(flows) {
    const f = flows.filter(x => x[0] && x[1]).map(([d, v]) => [new Date(d + "T12:00:00").getTime(), v]);
    if (f.length < 2 || !f.some(x => x[1] > 0) || !f.some(x => x[1] < 0)) return null;
    const t0 = Math.min(...f.map(x => x[0]));
    if ((Math.max(...f.map(x => x[0])) - t0) / 31557600000 < 0.08) return null; // under a month: a yearly rate would mislead
    const npv = r => f.reduce((s, [t, v]) => s + v / Math.pow(1 + r, (t - t0) / 31557600000), 0);
    let lo = -0.99, hi = 10;
    if (npv(lo) * npv(hi) > 0) return null;
    for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (npv(lo) * npv(m) <= 0) hi = m; else lo = m; }
    return (lo + hi) / 2 * 100;
  }
  // payday this month (moved to Friday when it falls on a weekend) and whether this month's contribution is saved yet
  function paydayThisMonth() {
    const d = +CFG.dzien_wyplaty; if (!d) return null;
    const n = new Date(), last = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate(), x = new Date(n.getFullYear(), n.getMonth(), Math.min(d, last), 12);
    while (x.getDay() === 0 || x.getDay() === 6) x.setDate(x.getDate() - 1);
    return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  }
  const boughtThisMonth = () => S.tx.some(t => !t.otwarcie && !isSell(t) && monthOf(t.data) === curMonth());
  function ikeLeft() {
    const lim = yearLimits(), rok = String(lim.rok);
    const paid = Math.max(+(lim.ike_wplacone || 0), S.tx.filter(t => t.konto === "IKE" && (t.data || "").startsWith(rok) && !isSell(t) && !t.otwarcie).reduce((s, t) => s + (+t.kwota_pln || 0), 0));
    return Math.max(0, (+lim.ike || 0) - paid);
  }
  // Yahoo symbol -> the ticker XTB shows (EIMI.L -> EIMI.UK)
  const xtbTicker = sym => (sym || "").replace(/\.L$/, ".UK").replace(/\.AS$/, ".NL").replace(/\.MI$/, ".IT");
  function splitWplata(c, amount) {
    if (!S.plan || !(amount > 0)) return [];
    const after = c.total + amount;
    const need = c.roles.map(r => Math.max(0, r.cel / 100 * after - r.wartosc));
    const sum = need.reduce((a, b) => a + b, 0);
    const skip = new Set(S.plan.nie_dokupujemy || []);
    return c.roles.map((r, i) => {
      const held = c.list.filter(p => p.rola === r.rola && !skip.has(p.isin)).map(p => p.isin);
      const opts = held.length ? held.slice(0, 1) : Object.keys(S.plan.role[r.rola].fundusze).filter(i2 => !skip.has(i2));
      return { rola: r.rola, nazwa: r.nazwa, kwota: amount * (sum ? need[i] / sum : r.cel / 100), isins: opts };
    }).filter(x => x.kwota >= 1);
  }

  /* ---------- bonds ---------- */
  const addYears = (d, n) => { const x = new Date(d + "T12:00:00"); x.setFullYear(x.getFullYear() + n); return x.toISOString().slice(0, 10); };
  const bondList = () => (S.cele?.obligacje || []).map(o => ({ seria: o.seria ?? o.nazwa ?? "", zakup: o.zakup || "", liczba: o.liczba ?? (o.kwota ? Math.round(o.kwota / 100) : ""), opr1: o.opr1 ?? "", marza: o.marza ?? "", uwaga: o.uwaga || "" }));
  const bondNominal = o => (+o.liczba || 0) * 100;
  // first-year interest accrues daily at the fixed rate; later years follow inflation, so only the nominal is shown
  const bondNow = o => { if (!o.zakup || !+o.liczba) return null; const days = (Date.now() - new Date(o.zakup + "T12:00:00")) / 86400000; return days >= 0 && days < 365 ? bondNominal(o) * (1 + (+o.opr1 || 0) / 100 * days / 365) : null; };
  const bondNext = o => { if (!o.zakup) return ""; for (let n = 1; n <= 4; n++) { const a = addYears(o.zakup, n); if (a >= today()) return a; } return ""; };
  const bondsValue = () => bondList().reduce((s, o) => s + (bondNow(o) ?? bondNominal(o)), 0);

  // each savings goal gets its own "odłożone" category, so money put aside in the budget fills the goal by itself
  const goalCat = g => "Cel: " + g.nazwa;
  const cats = typ => { const base = S.budzetCfg?.kategorie?.[typ] || DEFAULT_CATS[typ]; return typ === "odlozone" ? [...base, ...(S.cele?.oszczednosci || []).filter(g => g.nazwa).map(goalCat)] : base; };
  const limits = () => S.budzetCfg?.limity || {};
  const monthOf = d => (d || "").slice(0, 7);
  const shiftMonth = (m, k) => { const [y, mo] = m.split("-").map(Number); const d = new Date(y, mo - 1 + k, 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
  const monthName = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("pl-PL", { month: "long", year: "numeric" }); };
  function monthSum(m) {
    const e = S.budzet.filter(x => monthOf(x.data) === m);
    const sum = t => e.filter(x => x.typ === t).reduce((s, x) => s + (+x.kwota || 0), 0);
    const byCat = {};
    for (const x of e.filter(x => x.typ === "wydatek")) byCat[x.kategoria] = (byCat[x.kategoria] || 0) + (+x.kwota || 0);
    return { e, przychod: sum("przychod"), wydatek: sum("wydatek"), odlozone: sum("odlozone"), byCat };
  }
  function avgMonthlyExpenses() {
    const months = [...new Set(S.budzet.filter(x => x.typ === "wydatek").map(x => monthOf(x.data)))].filter(m => m < curMonth()).sort().slice(-3);
    if (!months.length) return null;
    return { avg: months.reduce((s, m) => s + monthSum(m).wydatek, 0) / months.length, months: months.length };
  }

  /* ---------- small renderers ---------- */
  function md(src) {
    const out = []; let list = null, para = [];
    const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const flushP = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
    const flushL = () => { if (list) { out.push("<ul>" + list.map(l => "<li>" + inline(l) + "</li>").join("") + "</ul>"); list = null; } };
    for (const raw of String(src || "").split("\n")) {
      const l = raw.trimEnd();
      if (/^#{1,4}\s/.test(l)) { flushP(); flushL(); out.push("<h3>" + inline(l.replace(/^#+\s/, "")) + "</h3>"); }
      else if (/^\s*[-*]\s/.test(l)) { flushP(); (list ||= []).push(l.replace(/^\s*[-*]\s/, "")); }
      else if (!l.trim()) { flushP(); flushL(); }
      else { flushL(); para.push(l.trim()); }
    }
    flushP(); flushL();
    return out.join("");
  }
  const bar = (v, max, target, kind = "") => `<div class="bar" aria-hidden="true"><div class="fill ${kind}" style="width:${max ? Math.max(0, Math.min(100, v / max * 100)) : 0}%"></div>${target != null ? `<div class="target" style="left:${target}%"></div>` : ""}</div>`;

  /* ---------- Budżet ---------- */

      </div>
      ${(() => { // fixed costs add up quietly: show them per year
        const src = m.e.some(x => x.typ === "wydatek" && (x.stale || x.kategoria === "Subskrypcje")) ? m : p;

          <p class="note">Wpisy oznaczone „co miesiąc” i subskrypcje${src === p ? `, z ${esc(monthName(shiftMonth(bMonth, -1)))}` : ""}. Raz na kwartał warto sprawdzić, czy wszystkich nadal używasz.</p></details>`; })()}

        ${entries.length ? `<div class="list">${entries.map(x => `<div class="item"><div class="t">${esc(x.kategoria)}${x.stale ? ' <span class="pill plain">co miesiąc</span>' : ""}</div><div class="a ${x.typ === "przychod" ? "up" : ""}">${x.typ === "przychod" ? "+" : x.typ === "odlozone" ? "→ " : "−"}${zl(+x.kwota, 2)}</div><div class="s">${esc((x.data || "").slice(8, 10) + "." + (x.data || "").slice(5, 7))} · ${esc(TYP[x.typ] || x.typ)}${x.opis ? " · " + esc(x.opis) : ""}</div><div>${S.canWrite ? `<button class="link" type="button" data-bdel="${esc(x._id)}">Usuń</button>` : ""}</div></div>`).join("")}</div>` : '<p class="note">Nic jeszcze nie wpisano.</p>'}
      </div>

        <div class="fgrid">${cats("wydatek").map((k, i) => `<div class="field"><label for="lim-${i}">${esc(k)}</label><input id="lim-${i}" type="number" min="0" step="50" inputmode="numeric" value="${esc(lim[k] ?? "")}"></div>`).join("")}</div>

      const [y, mo] = bMonth.split("-").map(Number), last = new Date(y, mo, 0).getDate();

      catch (err) { b.textContent = writeErr(err); }

      if (nc && !kat.wydatek.includes(nc)) kat.wydatek.splice(kat.wydatek.length - 1, 0, nc);
      $("#b-limsave").disabled = true; $("#b-limmsg").textContent = "Zapisuję…";
      try { await db.doc("app/budzet").set({ kategorie: kat, limity: l }); $("#b-limmsg").textContent = "Zapisano."; } catch (err) { $("#b-limmsg").textContent = writeErr(err); }
      $("#b-limsave").disabled = false;
    });
  }

  /* ---------- Portfel ---------- */
  function chart() {
    const h = [...S.historia].sort((a, b) => a.data.localeCompare(b.data));
    if (h.length < 2) return `<p class="note">Wykres wartości i wpłat pojawi się po drugiej aktualizacji kursów${h.length ? " (pierwszy punkt: " + esc(h[0].data) + ")" : ""}.</p>`;
    const W = 520, H = 200, L = 72, R = 10, T = 10, B = 26;
    const ys = h.flatMap(p => [p.wartosc, p.wplacono]);
    let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.1 || hi * 0.05 || 1; lo = Math.max(0, lo - pad); hi += pad;
    const x = i => L + i * (W - L - R) / (h.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
    const line = k => h.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
    const ticks = [0, 1, 2].map(i => lo + (hi - lo) * i / 2);
    const lab = v => new Intl.NumberFormat("pl-PL", { notation: "compact", maximumFractionDigits: 1 }).format(v);
    const xi = [0, h.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Wartość portfela i suma wpłat">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="0" y="${y(v) + 4}" text-anchor="start">${lab(v)}</text>`).join("")}
      <path d="${line("wplacono")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="${line("wartosc")}" fill="none" stroke="var(--red)" stroke-width="2.5"/>
      <circle cx="${x(h.length - 1)}" cy="${y(h[h.length - 1].wartosc)}" r="4" fill="var(--red)"/>
      ${xi.map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i ? "end" : "start"}">${esc(h[i].data.slice(5))}</text>`).join("")}
    </svg><p class="note"><span style="color:var(--red)">━</span> wartość &nbsp; ┅ suma wpłat</p>`;
  }
  /* ---------- fund card: what a fund is, what it did to its holders and what role it plays in the plan ---------- */

      ${p ? `<div><span class="label">Twoja pozycja</span>${row("Wartość", `<strong>${zl(p.wartosc)}</strong> · ${nf((p.wartosc || 0) / (c.total || 1) * 100, 1)}% portfela`)}${row("Zapłacone", zl(p.koszt))}${row("Wynik", `<span class="${cls(w)}">${szl(w)} (${pct(p.koszt ? w / p.koszt * 100 : null)})</span>`)}${p.jednostki > 0 ? row("Jednostki", nf(p.jednostki, 4)) : ""}${row("Konta", esc(Object.keys(p.konta).filter(x => p.konta[x] > 0).join(", ") || "–"))}${r ? row("Cel roli w planie", `${nf(r.cel, 0)}% ± ${nf(r.pasmo ?? 5, 0)} pkt`) : ""}</div>` : ""}

        <p class="note">W złotych, od ${dt(rk.od)} (tyle historii ma to notowanie). ${rk.zmiennosc_proc >= 25 ? "To fundusz o dużych wahaniach: kilkudziesięcioprocentowe spadki są dla niego normalne." : rk.zmiennosc_proc >= 18 ? "Wahania większe niż rynek światowy." : "Wahania podobne do szerokiego rynku."}</p></div>` : ""}

        <p class="note">Razem ${nf(cena.sklad.top.reduce((a, h) => a + h.p, 0), 0)}% funduszu. Branże: ${Object.entries(cena.sklad.sektory || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${esc(SEKTORY[k] || k)} ${nf(v, 0)}%`).join(", ")}.</p></div>` : ""}
      ${teza?.teza ? `<div><span class="label">Twoja teza${tip("teza")}</span><p>${esc(teza.teza)}</p>${teza.kiedy_sie_myle ? `<p class="note">Kiedy się mylę: ${esc(teza.kiedy_sie_myle.replace(/^SZKIC do zatwierdzenia:\s*/, ""))}</p>` : ""}</div>` : ""}
      <p class="note">To informacja, nie rekomendacja.</p></div></div>`;
    tipView = "fund";
    $("#tip-bg").addEventListener("click", ev => { if (ev.target.id === "tip-bg") closeTip(); });

  // the plan's weights replayed through real crashes (computed nightly with the prices); turns "a 30% drop" into złoty
  function crisisCard(c) {

      <div class="list">${k.wyniki.map(w => { const loss = base * w.spadek_proc / 100; return `<div class="item"><div class="t">${esc(w.nazwa)}</div><div class="a down">${base ? szl(loss) : pct(w.spadek_proc)}</div>
        <div class="s">${pct(w.spadek_proc)} w ${w.miesiace_spadku <= 1 ? "ok. miesiąc" : `${w.miesiace_spadku} mies.`}, odrobione ${mies(w.miesiace_powrotu)}${w.swiat_proc != null ? ` · sam świat: ${pct(w.swiat_proc)}` : ""}</div>
        <div class="s">${maj > base && base ? `cały majątek ${pct(loss / maj * 100)}` : ""}</div></div>`; }).join("")}</div>
      <p class="note">${esc(k.uwaga)} Przeszłość nie powtórzy się tak samo; to skala, a nie prognoza.</p></div>`;
  }
  // net worth over time: the history points written since bonds and the cushion were added to them
  function netChart() {
    const h = [...S.historia].filter(p => p.majatek != null).sort((a, b) => a.data.localeCompare(b.data));
    if (h.length < 2) return `<p class="note">Wykres całego majątku zacznie się rysować od najbliższych aktualizacji kursów${h.length ? " (pierwszy punkt: " + esc(h[0].data) + ")" : ""}. Wcześniejsze punkty miały tylko ETF-y.</p>`;
    const W = 520, H = 180, L = 72, R = 10, T = 10, B = 26;
    let lo = Math.min(...h.map(p => p.majatek)), hi = Math.max(...h.map(p => p.majatek)); const pad = (hi - lo) * 0.1 || hi * 0.05 || 1; lo = Math.max(0, lo - pad); hi += pad;
    const x = i => L + i * (W - L - R) / (h.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
    const lab = v => new Intl.NumberFormat("pl-PL", { notation: "compact", maximumFractionDigits: 1 }).format(v);

  /* ---------- look-through: the companies and sectors inside all funds together, weighted by what you hold ---------- */
  const SEKTORY = { technology: "Technologia", financial_services: "Finanse", healthcare: "Zdrowie", industrials: "Przemysł", consumer_cyclical: "Dobra luksusowe i handel",

  function lookThrough(c) {
    const firms = {}, sect = {}; let covered = 0, noData = 0;
    for (const p of c.list) {
      const v = p.wartosc || 0, sk = S.stan?.ceny?.[p.isin]?.sklad;
      if (!sk) { noData += v; continue; }
      for (const h of sk.top || []) { const k = h.s || h.n; const f = firms[k] ||= { n: h.n, v: 0, from: new Set() }; f.v += v * h.p / 100; f.from.add(p.isin); covered += v * h.p / 100; }
      const ss = Object.values(sk.sektory || {}).reduce((a, b) => a + b, 0) || 100;
      for (const [k, w] of Object.entries(sk.sektory || {})) sect[k] = (sect[k] || 0) + v * w / ss;
    }
    if (noData) sect._inne = noData;

  /* ---------- PIT-38 helper: sales on the ordinary account, cost by FIFO (the oldest units are sold first) ---------- */
  function taxYear(year) {
    const lots = {}, sales = [];
    for (const t of [...S.tx].filter(t => t.konto === "zwykle").sort((a, b) => (a.data || "").localeCompare(b.data || ""))) {
      const q = lots[t.isin] ||= [], u = +t.jednostki || 0, pln = +t.kwota_pln || 0;
      if (!isSell(t)) { if (u > 0) q.push({ u, c: pln / u }); continue; }
      let left = u, cost = 0;
      while (left > 1e-9 && q.length) { const take = Math.min(left, q[0].u); cost += take * q[0].c; q[0].u -= take; left -= take; if (q[0].u <= 1e-9) q.shift(); }
      if ((t.data || "").startsWith(String(year))) sales.push({ t, cost, gain: pln - cost, missing: left > 1e-6 });
    }
    const przychod = sales.reduce((s, x) => s + (+x.t.kwota_pln || 0), 0), koszty = sales.reduce((s, x) => s + x.cost, 0), dochod = przychod - koszty;
    return { sales, przychod, koszty, dochod, podatek: dochod > 0 ? Math.round(Math.round(dochod) * 0.19) : 0, missing: sales.some(x => x.missing) };
  }

        <ul class="checks" style="margin-top:6px">
          <li><span class="ic info">i</span><div>Koszt funduszu przez ${y} lat: <strong>${zl(fv(s, m, r, y) - net)}</strong>${t >= .003 ? ` · przy TER 0,20% byłoby ${zl(fv(s, m, r - .002, y) - net)} więcej` : ""}</div><span></span></li>
          <li><span class="ic info">i</span><div>Start rok później: <strong>${szl(fv(s, m, r - t, y - 1) - net)}</strong> na koniec okresu</div><span></span></li>

    el.querySelectorAll("[data-orm]").forEach(b => b.addEventListener("click", () => { S.cele = collect(); S.cele.obligacje.splice(+b.dataset.orm, 1); renderCele(); }));

  /* ---------- listening: each report has a spoken version (audio_tekst, written to be heard, not read) recorded as an MP3
     by GitHub Actions; it plays with the screen off and in the car. No robotic phone voice: until the file exists, the button says so ---------- */
  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
  const HEAD_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>';
  const RATES = [1, 1.15, 1.3, 1.5, 0.9];
  const PL = { q: [], i: -1, rate: 1, playing: false };
  let heard = {}, plDrag = false;
  try { PL.rate = +localStorage.getItem("nku-rate") || 1; heard = JSON.parse(localStorage.getItem("nku-heard") || "{}"); } catch (e) {}
  const aud = $("#aud");
  const mmss = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const fileOf = r => { const a = r?.audio; return a?.url && (!a.wygasa || a.wygasa >= today()) ? a : null; };
  function itemOf(kind, r) {
    if (kind === "wiedza") { const a = LIB_AUDIO[r.id]; return { id: "wiedza/" + r.id, title: r.tytul.replace(/^Książka w pigułce: /, ""), src: a && LIB_BASE ? LIB_BASE + a.plik : null, sec: a?.sekundy || 0, kind, r }; }
    const f = fileOf(r);
    return { id: kind + "/" + r._id, title: (kind === "dzienne" ? "Prasówka " : "Raport tygodnia ") + r.data.slice(8, 10) + "." + r.data.slice(5, 7), src: f?.url || null, sec: f?.sekundy || 0, kind, r };
  }
  function listenQueue() {
    const q = [], d = S.dzienne[0], w = S.raporty[0], age = x => (Date.now() - new Date(x.data + "T12:00:00")) / 86400000;
    if (d && age(d) <= 4) q.push(itemOf("dzienne", d));
    if (w && age(w) <= 8 && !heard["raporty/" + w._id]) q.push(itemOf("raporty", w));
    return q.filter(x => x.src);
  }
  function listenBtn(kind, r) {
    const it = itemOf(kind, r);
    if (kind === "wiedza") return it.src ? `<button class="listen" type="button" data-listen="wiedza|${esc(r.id)}" aria-pressed="false">${HEAD_SVG}<span class="lb">Odsłuchaj</span> · ${Math.max(1, Math.round(it.sec / 60))} min${heard[it.id] ? " · ✓" : ""}</button>` : `<span class="note">Nagranie lekcji pojawi się wkrótce.</span>`;
    if (!it.src) return (Date.now() - new Date(r.data + "T12:00:00")) / 86400000 <= 3 ? `<span class="note">Nagranie w przygotowaniu, zwykle gotowe do godziny po raporcie.</span>` : "";
    return `<button class="listen" type="button" data-listen="${kind}|${esc(r._id)}" aria-pressed="false">${HEAD_SVG}<span class="lb">Odsłuchaj</span>${it.sec ? " · " + Math.max(1, Math.round(it.sec / 60)) + " min" : ""}${heard[it.id] ? " · ✓" : ""}</button>`;
  }
  function listenAllBtn() {
    const q = listenQueue(); if (!q.length) { const d = S.dzienne[0]; return d && !fileOf(d) ? `<span class="note">Nagranie w przygotowaniu.</span>` : ""; }
    const min = q.reduce((a, x) => a + x.sec, 0) / 60;
    return `<button class="listen" type="button" data-listen="all">${HEAD_SVG}<span>Słuchaj${q.length > 1 ? " raportów (" + q.length + ")" : ""}</span>${min ? " · " + Math.max(1, Math.round(min)) + " min" : ""}</button>`;
  }
  function syncListen() {
    const cur = PL.q[PL.i]?.id;
    document.querySelectorAll("button.listen[data-listen]").forEach(b => {
      const [kind, id] = b.dataset.listen.split("|"), on = cur && cur === kind + "/" + id;
      b.setAttribute("aria-pressed", String(!!(on && PL.playing)));
      const lb = b.querySelector(".lb"); if (lb) lb.textContent = on ? (PL.playing ? "Słuchasz" : "Wstrzymane") : "Odsłuchaj";
    });
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-listen]"); if (!b) return;
    if (b.dataset.listen === "all") { const q = listenQueue(); if (q.length) { stopAll(); PL.q = q; playAt(0); } return; }
    const [kind, id] = b.dataset.listen.split("|");
    if (b.dataset.listen.startsWith("wiedzaq|")) { const q = libQueue(b.dataset.listen.slice(8)); if (q.length) { stopAll(); PL.q = q; playAt(0); } return; }
    const r = kind === "wiedza" ? LIB.find(x => x.id === id) : (kind === "dzienne" ? S.dzienne : S.raporty).find(x => x._id === id); if (!r) return;
    const it = itemOf(kind, r);
    if (PL.q[PL.i]?.id === it.id) { togglePlay(); return; }
    stopAll(); PL.q = [it]; playAt(0);
  });
  function stopAll() { aud.pause(); PL.playing = false; }
  function playAt(i) {
    stopAll();
    if (i < 0 || i >= PL.q.length) { closePlayer(); return; }
    PL.i = i; const it = PL.q[i];
    document.body.classList.add("playing"); $("#player").hidden = false;
    PL.playing = true;
    aud.src = it.src; aud.playbackRate = PL.rate;
    aud.play().catch(err => { if (err?.name !== "AbortError" && PL.q[PL.i] === it) { PL.playing = false; plUi(); $("#pl-time").textContent = "Nie udało się odtworzyć. Sprawdź internet."; } });
    mediaMeta(it); plUi();
  }
  function closePlayer() { stopAll(); PL.q = []; PL.i = -1; $("#player").hidden = true; document.body.classList.remove("playing"); if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "none"; syncListen(); }
  function togglePlay() {
    if (!PL.q[PL.i]) return;
    if (PL.playing) { PL.playing = false; aud.pause(); }
    else { PL.playing = true; aud.play().catch(() => {}); }
    plUi();
  }
  function seek(sec) {
    if (isFinite(aud.duration)) aud.currentTime = Math.max(0, Math.min(aud.duration - 0.5, aud.currentTime + sec));
  }
  function onEnded() {
    const it = PL.q[PL.i];
    if (it) { heard[it.id] = today(); try { localStorage.setItem("nku-heard", JSON.stringify(heard)); } catch (e) {} if (it.kind === "wiedza") markRead(it.r.id, true); }
    playAt(PL.i + 1);
  }
  function plUi() {
    const it = PL.q[PL.i]; if (!it) return;
    $("#pl-title").textContent = it.title + (PL.q.length > 1 ? ` (${PL.i + 1} z ${PL.q.length})` : "");
    $("#pl-play").innerHTML = PL.playing ? PAUSE_SVG : PLAY_SVG; $("#pl-play").setAttribute("aria-label", PL.playing ? "Pauza" : "Odtwarzaj");
    $("#pl-rate").textContent = String(PL.rate).replace(".", ",") + "×";
    $("#pl-next").disabled = PL.i >= PL.q.length - 1;
    const pos = aud.currentTime || 0, dur = isFinite(aud.duration) ? aud.duration : it.sec;
    $("#pl-time").textContent = mmss(pos) + " / " + mmss(dur);
    if (!plDrag && dur) $("#pl-pos").value = Math.round(pos / dur * 1000);
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = PL.playing ? "playing" : "paused";
    syncListen();
  }
  function mediaMeta(it) {
    if (!("mediaSession" in navigator)) return;
    try {
      const ms = navigator.mediaSession;
      ms.metadata = new MediaMetadata({ title: it.title, artist: "NKU", album: "Raporty", artwork: [{ src: "icon-512.png", sizes: "512x512", type: "image/png" }] });
      ms.setActionHandler("play", () => { if (!PL.playing) togglePlay(); });
      ms.setActionHandler("pause", () => { if (PL.playing) togglePlay(); });
      ms.setActionHandler("seekbackward", () => seek(-15));
      ms.setActionHandler("seekforward", () => seek(30));
      ms.setActionHandler("previoustrack", () => { if (PL.i > 0) playAt(PL.i - 1); else seek(-1e6); });
      ms.setActionHandler("nexttrack", () => { if (PL.i < PL.q.length - 1) playAt(PL.i + 1); });
    } catch (e) {}
  }
  aud.addEventListener("ended", onEnded);
  aud.addEventListener("timeupdate", plUi);
  aud.addEventListener("loadedmetadata", plUi);
  aud.addEventListener("play", () => { if (PL.q[PL.i]) { PL.playing = true; plUi(); } });

  aud.addEventListener("error", () => { if (PL.q[PL.i] && aud.getAttribute("src")) { PL.playing = false; plUi(); $("#pl-time").textContent = "Nie udało się wczytać nagrania."; } });
  $("#pl-play").onclick = togglePlay;
  $("#pl-back").onclick = () => seek(-15);
  $("#pl-fwd").onclick = () => seek(30);

  $("#pl-rate").onclick = () => {
    PL.rate = RATES[(RATES.indexOf(PL.rate) + 1) % RATES.length]; aud.playbackRate = PL.rate;

    plUi();
  };
  $("#pl-pos").addEventListener("input", () => { plDrag = true; });
