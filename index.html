<style>
/* Layout: one calm column, phone first. Start answers "is everything fine?", the rest is detail.
   Bottom bar on phones, top bar on wide screens, one red "+" for anything you need to write down. */
:root {
  --bg: #ffffff;
  --surface: #f6f5f4;
  --ink: #111111;
  --muted: #6b6866;
  --line: #e4e1df;
  --red: #d4151f;          /* brand: actions, the active tab, the "+" */
  --red-soft: #fbe6e6;
  --on-red: #ffffff;
  --up: #12804f;           /* gains */
  --up-soft: #e2f3ea;
  --down: #c2171f;         /* losses (always with a minus sign) */
  --warn: #9a6200;
  --warn-soft: #fbf0d9;
  --info-soft: #eeeceb;
  --f-display: "Archivo", "Arial Narrow", "Segoe UI", sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --surface: #161616; --ink: #f4f2f1; --muted: #a29e9b; --line: #2a2827;
    --red: #ff3b3f; --red-soft: #3a1214; --on-red: #0b0b0b;
    --up: #45c98a; --up-soft: #12301f; --down: #ff6a64; --warn: #f0b545; --warn-soft: #33270e; --info-soft: #1f1e1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0b; --surface: #161616; --ink: #f4f2f1; --muted: #a29e9b; --line: #2a2827;
  --red: #ff3b3f; --red-soft: #3a1214; --on-red: #0b0b0b;
  --up: #45c98a; --up-soft: #12301f; --down: #ff6a64; --warn: #f0b545; --warn-soft: #33270e; --info-soft: #1f1e1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
.mono, td.n { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.note { font-size: 0.84rem; color: var(--muted); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.up { color: var(--up); } .down { color: var(--down); }

/* top bar */
header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; flex: none; }
#asof { font-size: 0.8rem; color: var(--muted); text-align: right; }

/* navigation: five equal tabs at the bottom, kept compact on wide screens; the red "+" floats just above the bar on the right */
.navwrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabbar { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
nav.tabbar button[role=tab] { background: none; border: 0; height: var(--nav-h); min-width: 0; display: grid; place-items: center; align-content: center; gap: 3px; padding: 6px 2px; color: var(--muted); font: 600 0.7rem var(--f-body); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav.tabbar button[role=tab] svg { width: 22px; height: 22px; }
nav.tabbar button[aria-selected="true"] { color: var(--red); }

/* cards and blocks */
.card { background: var(--surface); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.hero { padding: 6px 0 2px; display: grid; gap: 6px; }
.hero .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3rem); letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.82rem; padding: 4px 10px; border-radius: 999px; background: var(--surface); white-space: nowrap; }
.chip b { font-weight: 600; font-family: var(--f-data); font-size: 0.8rem; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-data); font-size: 1.15rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 0.78rem; color: var(--muted); }

/* status list */
.status-head { display: flex; align-items: center; gap: 12px; }
.status-head .mark { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 800; font-family: var(--f-display); }
.status-head .mark.ok { background: var(--up-soft); color: var(--up); }
.status-head .mark.todo { background: var(--red); color: var(--on-red); }
ul.checks { list-style: none; margin: 0; padding: 0; display: grid; }
ul.checks li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
ul.checks li:first-child { border-top: 0; }
.ic { width: 18px; height: 18px; border-radius: 50%; margin-top: 3px; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.ic.ok { background: var(--up-soft); color: var(--up); }
.ic.todo { background: var(--red); color: var(--on-red); }
.ic.warn { background: var(--warn-soft); color: var(--warn); }
.ic.info { background: var(--info-soft); color: var(--muted); }
button.go { background: none; border: 0; color: var(--red); font: 600 0.86rem var(--f-body); cursor: pointer; padding: 2px 0; white-space: nowrap; }

/* monthly routine */
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--red); border-radius: 3px; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; }
ol.steps li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
ol.steps li:first-child { border-top: 0; }
ol.steps input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--red); margin: 0; }
ol.steps li.done span { color: var(--muted); text-decoration: line-through; }

/* bars */
.roles { display: grid; gap: 10px; }
.role { display: grid; gap: 4px; }
.role .row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.88rem; }
.bar { position: relative; height: 8px; background: var(--line); border-radius: 4px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ink); }
.bar .fill.red { background: var(--red); }
.bar .fill.warn { background: var(--warn); }
.bar .target { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--red); }

/* tables and lists */
.tablebox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.list { display: grid; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.item:first-child { border-top: 0; }
.item .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.item .s { font-size: 0.8rem; color: var(--muted); }
.item .a { font-family: var(--f-data); text-align: right; white-space: nowrap; }
details.more > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "+"; color: var(--red); font-weight: 800; }
details.more[open] > summary::after { content: "−"; }
details.more[open] > summary { margin-bottom: 10px; }
.pill { display: inline-block; font-size: 0.74rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--up-soft); color: var(--up); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--red-soft); color: var(--down); }
.pill.plain { background: var(--info-soft); color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); display: grid; gap: 4px; font-size: 0.92rem; }
.empty strong { color: var(--ink); }
.md { display: grid; gap: 8px; max-width: 70ch; font-size: 0.95rem; }
.md ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.md h3 { margin-top: 6px; }

/* forms */
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.fgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.card input, .card select { background: var(--bg); }
button.btn { font: 700 0.95rem var(--f-body); border-radius: 10px; padding: 11px 16px; border: 0; background: var(--red); color: var(--on-red); cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.btn:disabled { opacity: 0.5; cursor: default; }
button.link { background: none; border: 0; padding: 0; color: var(--down); font: inherit; font-size: 0.82rem; cursor: pointer; text-decoration: underline; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.notice { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
.monthnav { display: flex; align-items: center; gap: 8px; }
.monthnav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
.monthnav strong { font-family: var(--f-display); font-size: 1.05rem; min-width: 150px; text-align: center; text-transform: capitalize; }

/* the red "+" and the quick-add sheet */
.fab { position: fixed; z-index: 21; right: max(16px, env(safe-area-inset-right, 0px), calc(50% - 364px)); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--red); color: var(--on-red); display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.28); }
.fab svg { width: 24px; height: 24px; }
.fab:active { transform: scale(.95); }
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 92vh; overflow-y: auto; }
@media (min-width: 600px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
/* glossary: a "?" next to a term opens its explanation above whatever is open */
button.tip { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-left: 4px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--red); font: 800 0.72rem var(--f-body); cursor: pointer; vertical-align: middle; padding: 0; text-transform: none; letter-spacing: 0; }
.learn { background: var(--surface); border-left: 3px solid var(--red); border-radius: 0 10px 10px 0; padding: 10px 12px; display: grid; gap: 6px; font-size: 0.9rem; }
.learn strong.h { font-family: var(--f-display); }
#tip-root .sheet-bg { z-index: 50; }
.gloss { display: grid; gap: 4px; }
.gloss button { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 2px; font: 600 0.95rem var(--f-body); color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.gloss button::after { content: "›"; color: var(--red); }
.levels { display: grid; gap: 8px; }
.levels button { text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 12px 14px; cursor: pointer; font: inherit; display: grid; gap: 2px; }
.levels button[aria-pressed="true"] { border-color: var(--red); box-shadow: 0 0 0 1px var(--red) inset; }
.levels button strong { font-family: var(--f-display); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; padding: 9px 4px; border-radius: 8px; font: 700 0.82rem var(--f-body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.amount { font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; text-align: center; border: 0; border-bottom: 2px solid var(--line); border-radius: 0; background: transparent; padding: 6px 0; }
.amount:focus { border-bottom-color: var(--red); outline: none; }
.catchips { display: flex; flex-wrap: wrap; gap: 6px; }
.catchips button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: 600 0.84rem var(--f-body); cursor: pointer; }
.catchips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
svg text { fill: var(--muted); font-family: var(--f-data); font-size: 11px; }
.topright { display: flex; align-items: center; gap: 4px; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: none; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn[aria-pressed="true"] { color: var(--red); }
.setrow { display: grid; gap: 6px; }
.seg.n2 { grid-template-columns: repeat(2, 1fr); } .seg.n3 { grid-template-columns: repeat(3, 1fr); }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.switch input { width: 22px; height: 22px; accent-color: var(--red); flex: none; }
/* privacy: amounts are blurred until you turn it off (handy in public) */
html.priv :is(.big, .chip b, .item .a, td.n, .mono, .md, ul.checks li > div, .kpi .v, #wpl-out) { filter: blur(7px); user-select: none; }
@media (prefers-reduced-motion: no-preference) { .bar .fill, .progress > div { transition: width .35s ease; } }
</style>

(() => {
  const S = { plan: null, stan: null, cele: null, tx: [], raporty: [], dzienne: [], analizy: [], historia: [], budzet: [], budzetCfg: null, przeglad: null, loaded: {}, canWrite: true };

  /* ---------- portfolio calculations ---------- */
  function fundIndex() {
    const role = {}, name = {};
    if (!S.plan) return { role, name };
    for (const [r, d] of Object.entries(S.plan.role)) for (const [isin, n] of Object.entries(d.fundusze)) { role[isin] = r; name[isin] = n; }
    return { role, name };
  }
  const isSell = t => String(t.typ).startsWith("sprz");
  function calc() {
    const { role, name } = fundIndex();
    const ceny = S.stan?.ceny || {};
    const pos = {};
    const txs = [...S.tx].sort((a, b) => (a.data || "").localeCompare(b.data || ""));
    for (const t of txs) {
      const p = pos[t.isin] ||= { isin: t.isin, nazwa: name[t.isin] || t.isin, rola: role[t.isin] || "inne", jednostki: 0, koszt: 0, konta: {} };
      const u = +t.jednostki || 0, pln = +t.kwota_pln || 0;
      if (isSell(t)) { if (p.jednostki > 0) p.koszt -= p.koszt * Math.min(1, u / p.jednostki); p.jednostki -= u; p.konta[t.konto] = (p.konta[t.konto] || 0) - u; }
      else if (t.jednostki == null && t.wartosc_otwarcia_pln) { p.stat = (p.stat || 0) + +t.wartosc_otwarcia_pln; p.koszt += pln; p.konta[t.konto] = (p.konta[t.konto] || 0) + 1; } // units come with the first nightly price
      else { p.jednostki += u; p.koszt += pln; p.konta[t.konto] = (p.konta[t.konto] || 0) + u; }
    }
    const list = Object.values(pos).filter(p => p.jednostki > 1e-9 || p.stat > 0).map(p => {
      const c = ceny[p.isin];
      const wartosc = c || p.stat ? (c ? p.jednostki * c.pln : 0) + (p.stat || 0) : null;
      return { ...p, cena: c, wartosc, prev: c && !p.stat ? wartosc / (1 + c.tydz_pln_proc / 100) : wartosc };
    }).sort((a, b) => (b.wartosc || 0) - (a.wartosc || 0));
    const total = list.reduce((s, p) => s + (p.wartosc || 0), 0);
    const prevTotal = list.reduce((s, p) => s + (p.prev || 0), 0);
    const koszt = list.reduce((s, p) => s + p.koszt, 0);
    const wplacono = txs.reduce((s, t) => s + (isSell(t) ? -1 : 1) * (+t.kwota_pln || 0), 0);
    const roles = S.plan ? Object.entries(S.plan.role).map(([r, d]) => {
      const v = list.filter(p => p.rola === r).reduce((s, p) => s + (p.wartosc || 0), 0);
      const w = total ? v / total * 100 : 0;
      return { rola: r, nazwa: d.nazwa, cel: d.cel, wartosc: v, waga: w, odch: w - d.cel };
    }) : [];
    // an opening balance counts at its market value on the opening day, so the yearly rate
    // and the MSCI World comparison measure only what happened after it
    const flowPln = t => +(t.wartosc_otwarcia_pln ?? t.kwota_pln) || 0;
    const flows = txs.map(t => [t.data, isSell(t) ? flowPln(t) : -flowPln(t)]);
    if (total > 0) flows.push([S.stan?.asOf?.slice(0, 10) || today(), total]);
    const xirr = irr(flows);
    let bench = null;
    const ser = S.stan?.benchmark?.seria;
    if (ser?.length && txs.length) {
      const priceAt = d => { if (d <= ser[0][0]) return ser[0][1]; let lo = 0, hi = ser.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ser[m][0] <= d) lo = m; else hi = m - 1; } return ser[lo][1]; };
      let units = 0;
      for (const t of txs) units += (isSell(t) ? -1 : 1) * flowPln(t) / priceAt(t.data);
      bench = units * ser[ser.length - 1][1];
    }
    return { list, total, prevTotal, koszt, wplacono, roles, xirr, bench };
  }
  function irr(flows) {
    const f = flows.filter(x => x[0] && x[1]).map(([d, v]) => [new Date(d + "T12:00:00").getTime(), v]);
    if (f.length < 2 || !f.some(x => x[1] > 0) || !f.some(x => x[1] < 0)) return null;
    const t0 = Math.min(...f.map(x => x[0]));
    if ((Math.max(...f.map(x => x[0])) - t0) / 31557600000 < 0.08) return null; // under a month: a yearly rate would mislead
    const npv = r => f.reduce((s, [t, v]) => s + v / Math.pow(1 + r, (t - t0) / 31557600000), 0);
    let lo = -0.99, hi = 10;
    if (npv(lo) * npv(hi) > 0) return null;
    for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (npv(lo) * npv(m) <= 0) hi = m; else lo = m; }
    return (lo + hi) / 2 * 100;
  }
  function splitWplata(c, amount) {
    if (!S.plan || !(amount > 0)) return [];
    const after = c.total + amount;
    const need = c.roles.map(r => Math.max(0, r.cel / 100 * after - r.wartosc));
    const sum = need.reduce((a, b) => a + b, 0);
    const skip = new Set(S.plan.nie_dokupujemy || []);
    return c.roles.map((r, i) => {
      const held = c.list.filter(p => p.rola === r.rola && !skip.has(p.isin)).map(p => p.isin);
      const opts = held.length ? held.slice(0, 1) : Object.keys(S.plan.role[r.rola].fundusze).filter(i2 => !skip.has(i2));
      return { rola: r.rola, nazwa: r.nazwa, kwota: amount * (sum ? need[i] / sum : r.cel / 100), isins: opts };
    }).filter(x => x.kwota >= 1);
  }

  /* ---------- bonds ---------- */
  const addYears = (d, n) => { const x = new Date(d + "T12:00:00"); x.setFullYear(x.getFullYear() + n); return x.toISOString().slice(0, 10); };
  const bondList = () => (S.cele?.obligacje || []).map(o => ({ seria: o.seria ?? o.nazwa ?? "", zakup: o.zakup || "", liczba: o.liczba ?? (o.kwota ? Math.round(o.kwota / 100) : ""), opr1: o.opr1 ?? "", marza: o.marza ?? "", uwaga: o.uwaga || "" }));
  const bondNominal = o => (+o.liczba || 0) * 100;
  // first-year interest accrues daily at the fixed rate; later years follow inflation, so only the nominal is shown
  const bondNow = o => { if (!o.zakup || !+o.liczba) return null; const days = (Date.now() - new Date(o.zakup + "T12:00:00")) / 86400000; return days >= 0 && days < 365 ? bondNominal(o) * (1 + (+o.opr1 || 0) / 100 * days / 365) : null; };
  const bondNext = o => { if (!o.zakup) return ""; for (let n = 1; n <= 4; n++) { const a = addYears(o.zakup, n); if (a >= today()) return a; } return ""; };

  /* ---------- small renderers ---------- */
  function md(src) {
    const out = []; let list = null, para = [];
    const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const flushP = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
    const flushL = () => { if (list) { out.push("<ul>" + list.map(l => "<li>" + inline(l) + "</li>").join("") + "</ul>"); list = null; } };
    for (const raw of String(src || "").split("\n")) {
      const l = raw.trimEnd();
      if (/^#{1,4}\s/.test(l)) { flushP(); flushL(); out.push("<h3>" + inline(l.replace(/^#+\s/, "")) + "</h3>"); }
      else if (/^\s*[-*]\s/.test(l)) { flushP(); (list ||= []).push(l.replace(/^\s*[-*]\s/, "")); }
      else if (!l.trim()) { flushP(); flushL(); }
      else { flushL(); para.push(l.trim()); }
    }
    flushP(); flushL();
    return out.join("");
  }

  /* ---------- Start ---------- */
  function checks(c) {
    const out = [];
    const m = monthSum(curMonth());
    if (S.loaded.plan && !S.plan) out.push({ lvl: "todo", t: "Ustaw swój plan", s: "Cel, podział portfela i zasady. Ok. 10 minut.", go: "plan" });
    else if (!c.list.length) out.push({ lvl: "todo", t: "Dodaj swoje pozycje", s: "Przez Mój plan → Obecny stan albo czerwony plus.", go: "portfel" });
    const prz = S.plan?.profil?.przeglad;
    if (prz && prz <= today()) out.push({ lvl: "todo", t: "Czas na przegląd planu", s: "Sprawdź cel, wagi i tezy. Zmieniaj tylko z ważnego powodu.", go: "plan" });
    if (!m.przychod) out.push({ lvl: "todo", t: "Wpisz wypłatę z tego miesiąca", s: "To 10 sekund przez czerwony plus.", go: "add:przychod" });
    const lim = limits();
    const over = Object.entries(m.byCat).filter(([k, v]) => +lim[k] && v > +lim[k]);
    for (const [k, v] of over) out.push({ lvl: "warn", t: `${k}: limit przekroczony o ${zl(v - lim[k])}`, go: "budzet" });
    if (m.przychod && !over.length) out.push({ lvl: "ok", t: `Budżet: wydane ${zl(m.wydatek)}, odłożone ${zl(m.odlozone)}`, s: m.przychod ? `stopa oszczędzania ${pct(m.odlozone / m.przychod * 100, 0, false)}` : "", go: "budzet" });
    const pod = S.cele?.poduszka || {};
    if (!+pod.cel) out.push({ lvl: "todo", t: "Ustaw cel poduszki finansowej", s: "3–6 miesięcy Twoich wydatków.", go: "cele" });
    else if (+pod.zebrane < +pod.cel) out.push({ lvl: "info", t: `Poduszka: ${pct(+pod.zebrane / +pod.cel * 100, 0, false)} celu`, s: `${zl(+pod.zebrane)} z ${zl(+pod.cel)}`, go: "cele" });
    else out.push({ lvl: "ok", t: "Poduszka finansowa gotowa", go: "cele" });
    if (c.list.length) {
      const band = r => S.plan?.role?.[r.rola]?.pasmo ?? 5;
      const out_ = c.roles.filter(r => Math.abs(r.odch) > band(r)).sort((a, b) => Math.abs(b.odch) - Math.abs(a.odch));
      if (out_.length) out.push({ lvl: "info", t: `Poza pasmem: ${out_[0].nazwa} ${pct(out_[0].odch, 1)} pkt od celu${out_.length > 1 ? ` (i ${out_.length - 1} inne)` : ""}`, s: S.plan?.profil?.rebalans === "rok" ? "Według Twoich zasad wyrównujesz raz w roku." : "Wyrównujesz to wpłatami, bez sprzedawania.", go: "portfel" });
      else out.push({ lvl: "ok", t: "Portfel mieści się w pasmach planu", go: "portfel" });
    }
    const lim2 = S.cele?.limity || {};
    const rok = String(lim2.rok || new Date().getFullYear());
    if (rok === today().slice(0, 4)) {
      const ikeW = Math.max(+(lim2.ike_wplacone || 0), S.tx.filter(t => t.konto === "IKE" && (t.data || "").startsWith(rok) && !isSell(t) && !t.otwarcie).reduce((s, t) => s + (+t.kwota_pln || 0), 0));
      const left = (+lim2.ike || 0) - ikeW, days = Math.ceil((new Date(rok + "-12-31T23:59:59") - new Date()) / 86400000);
      if (left > 0 && days <= 75) out.push({ lvl: "warn", t: `IKE: ${zl(left)} limitu przepada za ${days} dni`, s: "Limit nie przechodzi na kolejny rok.", go: "cele" });
    }
    for (const o of bondList()) {
      const n = bondNext(o);
      if (n && (new Date(n) - new Date()) / 86400000 <= 45) {
        const yr1 = n === addYears(o.zakup, 1);
        out.push({ lvl: "info", t: `${n.split("-").reverse().join(".")}: odsetki z ${o.seria || "obligacji"}`, s: yr1 && +o.opr1 ? `ok. ${zl(bondNominal(o) * o.opr1 / 100 * 0.81, 2)} na rękę` : "", go: "cele" });
      }
    }
    const last = S.raporty[0];
    const age = last ? (Date.now() - new Date(last.data + "T12:00:00")) / 86400000 : Infinity;
    if (age > 8 && S.plan) out.push({ lvl: "info", t: "Raport tygodnia pojawia się w soboty rano", s: "Sam, bez Twojego udziału. Raport dzienny: pn–pt rano.", go: "raporty" });
    const red = last ? Object.entries(last.tezy || {}).filter(([, v]) => v === "czerwony").map(([k]) => S.plan?.role?.[k]?.nazwa || k) : [];
    if (red.length) out.push({ lvl: "warn", t: "Sygnał ostrzegawczy: " + red.join(", "), go: "raporty" });
    return out;
  }
  const STEPS = [

      })()}
      ${(() => { const d = S.dzienne[0]; if (!d || (Date.now() - new Date(d.data + "T12:00:00")) / 86400000 > 4) return ""; return `<div class="card"><header><h2>Na rynkach</h2><span class="note">${esc(d.data)}</span></header><div class="md">${md(d.podsumowanie || d.tresc)}</div><div class="actions"><button class="go" type="button" data-go="raporty">Cały raport</button></div></div>`; })()}

  /* ---------- Portfel ---------- */
  function chart() {
    const h = [...S.historia].sort((a, b) => a.data.localeCompare(b.data));
    if (h.length < 2) return `<p class="note">Wykres wartości i wpłat pojawi się po drugiej aktualizacji kursów${h.length ? " (pierwszy punkt: " + esc(h[0].data) + ")" : ""}.</p>`;
    const W = 520, H = 200, L = 56, R = 10, T = 10, B = 26;
    const ys = h.flatMap(p => [p.wartosc, p.wplacono]);
    let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.1 || hi * 0.05 || 1; lo = Math.max(0, lo - pad); hi += pad;
    const x = i => L + i * (W - L - R) / (h.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
    const line = k => h.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
    const ticks = [0, 1, 2].map(i => lo + (hi - lo) * i / 2);
    const lab = v => new Intl.NumberFormat("pl-PL", { notation: "compact", maximumFractionDigits: 1 }).format(v);
    const xi = [0, h.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Wartość portfela i suma wpłat">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${lab(v)}</text>`).join("")}
      <path d="${line("wplacono")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="${line("wartosc")}" fill="none" stroke="var(--red)" stroke-width="2.5"/>
      <circle cx="${x(h.length - 1)}" cy="${y(h[h.length - 1].wartosc)}" r="4" fill="var(--red)"/>
      ${xi.map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${i ? "end" : "start"}">${esc(h[i].data.slice(5))}</text>`).join("")}
    </svg><p class="note"><span style="color:var(--red)">━</span> wartość &nbsp; ┅ suma wpłat</p>`;
  }

      <details class="more card"><summary>Historia transakcji (${txs.length})</summary>

  function promptFor(c) {
    const cur = curMonth(), months = [shiftMonth(cur, -2), shiftMonth(cur, -1), cur];
    const data = {
      dzis: today(), ceny_z: Object.values(S.stan?.ceny || {})[0]?.data,
      plan: { role: Object.fromEntries(Object.entries(S.plan?.role || {}).map(([k, d]) => [k, { nazwa: d.nazwa, cel: d.cel, fundusze: d.fundusze }])), nie_dokupujemy: S.plan?.nie_dokupujemy, tezy: S.plan?.tezy },
      portfel: { wartosc_pln: Math.round(c.total), koszt_pln: Math.round(c.koszt), tydzien_pln: Math.round(c.total - c.prevTotal), xirr_proc: c.xirr && +c.xirr.toFixed(1), te_same_wplaty_w_msci_world_pln: c.bench && Math.round(c.bench) },
      pozycje: c.list.map(p => ({ fundusz: p.nazwa, rola: p.rola, konta: p.konta, wartosc_pln: Math.round(p.wartosc || 0), koszt_pln: Math.round(p.koszt), miesiac_pln_proc: p.cena?.mies_pln_proc })),
      role: c.roles.map(r => ({ rola: r.nazwa, cel: r.cel, waga: +r.waga.toFixed(1) })),
      cele: { poduszka: S.cele?.poduszka, limity_ike_ikze: S.cele?.limity, obligacje_wartosc_pln: Math.round(bondsValue()), obligacje: bondList() },
      budzet: { limity: limits(), srednie_wydatki: avgMonthlyExpenses(), miesiace: months.map(mm => { const s = monthSum(mm); return { miesiac: mm, przychody: Math.round(s.przychod), wydatki: Math.round(s.wydatek), odlozone: Math.round(s.odlozone), wydatki_wg_kategorii: Object.fromEntries(Object.entries(s.byCat).map(([k, v]) => [k, Math.round(v)])) }; }) },
      wskazniki: S.stan?.wskazniki,
      ostatni_raport: S.raporty[0] ? { data: S.raporty[0].data, tezy: S.raporty[0].tezy, tresc: String(S.raporty[0].tresc || "").slice(0, 6000) } : null,
      poprzednia_analiza: S.analizy[0] ? { data: S.analizy[0].data, tresc: String(S.analizy[0].tresc || "").slice(0, 2500) } : null
    };
    return `Jesteś analitykiem, który pomaga jednej osobie prowadzić finanse: długoterminowy portfel ETF (horyzont 5-10 lat, XTB, regularne wpłaty), obligacje skarbowe, poduszkę i budżet domowy. Napisz po polsku krótką, spokojną analizę na podstawie danych JSON poniżej. Celem jest, żeby po przeczytaniu ta osoba wiedziała, czy wszystko jest w porządku i co ewentualnie zrobić w tym miesiącu.

Zasady:
- Nie mów, co kupić, sprzedać ani ile; nie jesteś licencjonowanym doradcą. Wagi i tezy należą do tej osoby. Możesz opisać, co wynika z jej własnej zasady ("dokupuj to, co najbardziej poniżej celu").
- Bez prognoz cen. Scenariusze tylko warunkowo ("jeśli X, to zwykle Y").
- "Warte sprawdzenia" to rzeczy wynikające z danych (pozycja poniżej celu, limit IKE/IKZE przed końcem roku, warunek tezy, poduszka, kategoria budżetu ponad limitem), nigdy "okazja do zakupu".
- Tydzień to szum przy horyzoncie 10 lat; tezy oceniaj przez fakty z raportu.
- Opieraj się tylko na tych danych; nie przeglądasz internetu. Brak danych opisz jednym zdaniem.
- Jeśli jest poprzednia analiza, napisz krótko, co się zmieniło.

Format (Markdown, nagłówki ##, punkty "- ", bez tabel, razem najwyżej ok. 400 słów):
## W skrócie
2-3 zdania: czy wszystko jest w porządku.
## Portfel i plan
## Finanse domowe
## Tezy
## W tym miesiącu warto
2-4 konkretne kroki (wynikające z planu i danych).

Dane:
${JSON.stringify(data)}`;

  async function runAnalysis() {
    if (aiBusy || !sample) return;
    const c = calc();
    aiBusy = true; aiErr = ""; aiText = ""; aiCtl = new AbortController();
    renderRaporty(c);
    $("#ai-out").textContent = "Claude myśli… pierwsza część odpowiedzi zwykle pojawia się po kilkunastu sekundach.";
    try {
      const { text, truncated } = await sample(promptFor(c), { signal: aiCtl.signal, cache: false, onText: ({ text }) => { aiText = text; const o = $("#ai-out"); if (o) o.innerHTML = md(text); } });
      aiText = text; aiErr = truncated ? "Analiza została ucięta." : "";
      if (S.canWrite && db) {
        try { await db.collection("analizy").add({ data: new Date().toISOString().slice(0, 16).replace("T", " "), tresc: text, wartosc: Math.round(c.total) }); aiErr = aiErr || "Zapisano."; }
        catch (err) { aiErr = "Gotowe, ale nie zapisano: " + writeErr(err); }
      }
    } catch (e) {
      aiText = e?.text || "";
      aiErr = e?.code === "cancelled" ? "Zatrzymano." : (e?.code === "not_granted" || e?.code === "sampling_disabled") ? "Strona nie ma zgody na użycie Claude." : e?.code === "rate_limited" ? "Za dużo zapytań albo wyczerpany limit. Spróbuj później." : e?.code === "session_expired" ? "Zaloguj się ponownie do Claude." : "Nie udało się dokończyć analizy. Spróbuj ponownie.";
      if (e?.code === "not_granted" || e?.code === "sampling_disabled") sample = null;
    } finally { aiBusy = false; renderRaporty(calc()); }
  }

  function drawSheet() {
    const root = $("#sheet-root");
    if (!sheet) { root.innerHTML = ""; return; }
    const { mode, pre } = sheet;
    const { name } = fundIndex();
    const skip = new Set(S.plan?.nie_dokupujemy || []);
    const funds = Object.keys(name).sort((a, b) => skip.has(a) - skip.has(b));
    const modes = { wydatek: "Wydatek", przychod: "Przychód", odlozone: "Odłożone", etf: "Zakup ETF" };
    const k = cats(mode === "etf" ? "wydatek" : mode);
    if (mode !== "etf" && !k.includes(sheet.kat)) sheet.kat = mode === "przychod" ? k[0] : null;
    root.innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Dodaj wpis">
      <div class="seg" role="group" aria-label="Rodzaj">${Object.entries(modes).map(([m, l]) => `<button type="button" data-mode="${m}" aria-pressed="${m === mode}">${l}</button>`).join("")}</div>
      <form id="qf" style="display:grid;gap:14px">
        <input class="amount" id="q-kw" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0 zł" required value="${esc(pre.kwota ?? "")}" aria-label="Kwota w złotych">

      } else {

      <div class="actions"><button class="btn ghost" type="button" id="o-add2">Dodaj fundusz</button></div>`; }
    else { const ww = wWarnings(), start = calc().total || W.otwarcie.reduce((s, o) => s + (+o.wartosc || 0), 0), yrs = Math.max(0, (+P.cel_rok || 0) - new Date().getFullYear()), goal = +P.cel_kwota || 0;
      const sc = [["ostrożnie", .02], ["umiarkowanie", .04], ["optymistycznie", .06]].map(([l, r]) => [l, r, fv(start, +P.wplata || 0, r, yrs)]);
      body = `<div class="md">
      <h3>Cel</h3><p>${esc({ emerytura: "Emerytura", mieszkanie: "Mieszkanie / duży zakup", pomnazanie: "Pomnażanie" }[P.cel])}${goal ? `: ${zl(goal)}` : ""}, rok ${esc(P.cel_rok)} (${yrs} lat). Wpłata ${zl(+P.wplata)} miesięcznie, konta: ${esc(P.konta.join(", "))}, ${esc(P.broker)}.</p>
      <h3>Podział</h3><ul>${W.role.map(r => `<li>${esc(r.nazwa)}: <strong>${nf(+r.cel || 0, 0)}%</strong> ± ${esc(r.pasmo)} pkt · ${esc(r.fundusze.map(f => f.nazwa).join(", ") || "brak funduszu")}${r.rdzen ? " · rdzeń" : ""}</li>`).join("")}</ul>
      <p>Średni koszt (TER) ok. <strong>${nf(ww.ter, 2)}%</strong> rocznie.</p>
      <h3>Zasady</h3><ul><li>Wyrównuję: ${esc({ wplaty: "nowymi wpłatami, dokupując to, co najbardziej poniżej celu", pasmo: "gdy waga wyjdzie poza pasmo", rok: "raz w roku" }[P.rebalans])}.</li>${P.przy_spadku ? `<li>Przy spadku: ${esc(P.przy_spadku)}</li>` : ""}${P.zmiana_planu ? `<li>Zmieniam plan: ${esc(P.zmiana_planu)}</li>` : ""}<li>Przegląd planu: ${esc(P.przeglad)}.</li></ul>
      ${yrs ? `<h3>Ile może być w ${esc(P.cel_rok)}</h3><p class="note">Ilustracja przy stałych wpłatach i założonej rocznej stopie po inflacji. To założenia, nie prognoza: rzeczywiste wyniki będą inne i mogą być ujemne.</p><ul>${sc.map(([l, r, v]) => `<li>${l} (${nf(r * 100, 0)}% rocznie): <strong>${zl(v)}</strong>${goal ? (v >= goal ? " · cel osiągnięty" : ` · brakuje ${zl(goal - v)}`) : ""}</li>`).join("")}</ul>` : ""}
      </div>${ww.list.length ? `<ul class="checks">${ww.list.map(t => `<li><span class="ic warn">!</span><div>${esc(t)}</div><span></span></li>`).join("")}</ul>` : ""}
      <p class="note">Plan jest Twoją decyzją. Aplikacja tylko pilnuje, żebyś się go trzymał, i ostrzega o rzeczach, które łatwo przeoczyć.</p>`; }
    root.innerHTML = `<div class="sheet-bg" id="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Mój plan" style="max-width:640px">
      <header style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><span class="label">Mój plan · krok ${wStep + 1} z ${W_STEPS.length}</span><h2>${esc(step)}</h2></div><button class="btn ghost" type="button" id="w-x">Zamknij</button></header>
      <div class="progress"><div style="width:${(wStep + 1) / W_STEPS.length * 100}%"></div></div>
      ${body}
      <div class="actions" style="justify-content:space-between">${wStep ? '<button class="btn ghost" type="button" id="w-back">Wstecz</button>' : "<span></span>"}${wStep < W_STEPS.length - 1 ? '<button class="btn" type="button" id="w-next">Dalej</button>' : '<button class="btn" type="button" id="w-save">Zapisz plan</button>'}</div>
      <p class="note" id="w-msg" role="status"></p></div></div>`;
    // inputs
    root.querySelectorAll("[data-f]").forEach(el => el.addEventListener("input", () => { P[el.dataset.f] = el.value; }));
    root.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { P[b.dataset.p] = b.dataset.v; drawWizard(); });
    root.querySelectorAll("[data-konto]").forEach(b => b.onclick = () => { const k = b.dataset.konto; P.konta = P.konta.includes(k) ? P.konta.filter(x => x !== k) : [...P.konta, k]; drawWizard(); });
    root.querySelectorAll("[data-w]").forEach(el => el.addEventListener("input", () => { W[el.dataset.w] = el.value; }));
    root.querySelectorAll("[data-pod]").forEach(el => el.addEventListener("input", () => { W.poduszka[el.dataset.pod] = el.value; }));
    root.querySelectorAll("[data-podx]").forEach(b => b.onclick = () => { W.poduszka.cel = Math.round(+W.wydatki * +b.dataset.podx / 100) * 100; drawWizard(); });
    root.querySelectorAll("[data-tpl]").forEach(b => b.onclick = () => { applyTpl(b.dataset.tpl); drawWizard(); });
    root.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => {
      W.poziom = b.dataset.lv; saveCfg({ poziom: W.poziom });
      // starting points by level, only while the plan is still empty; weights and funds stay the user's choice
      if (!W.role.length || W._tplAuto) { W._tplAuto = true; applyTpl(W.poziom === "poczatkujacy" ? "jeden" : W.poziom === "sredni" ? "obl" : null); }
      if (W.poziom === "poczatkujacy") {
        P.przy_spadku ||= "Nie sprzedaję. Wpłacam dalej według planu. Sprawdzam, czy poduszka jest cała.";
        P.zmiana_planu ||= "Tylko gdy zmieni się mój cel, horyzont albo sytuacja życiowa. Nie z powodu wiadomości czy spadku.";
      }
      drawWizard();
    });
    root.querySelectorAll("[data-r]").forEach(el => el.addEventListener("change", () => { const r = W.role[+el.dataset.r]; r[el.dataset.k] = el.dataset.k === "nazwa" ? el.value : (el.value === "" ? "" : +el.value); drawWizard(); }));
    root.querySelectorAll("[data-rf]").forEach(el => el.addEventListener("change", () => { const r = W.role[+el.dataset.rf]; if (el.value === "inny") { r._inny = true; r.fundusze = []; } else { r._inny = false; r.fundusze = el.value ? [{ isin: el.value, nazwa: KAT[el.value].nazwa }] : []; } drawWizard(); }));
    root.querySelectorAll("[data-ri]").forEach(el => el.addEventListener("change", () => { const r = W.role[+el.dataset.ri], v = el.value.trim().toUpperCase(); if (!ISIN_RE.test(v)) { $("#w-msg").textContent = "ISIN ma 12 znaków, np. IE00B4L5Y983."; return; } r.fundusze = [{ isin: v, nazwa: r.fundusze[0]?.nazwa || v }]; drawWizard(); }));
    root.querySelectorAll("[data-rn]").forEach(el => el.addEventListener("change", () => { const r = W.role[+el.dataset.rn]; if (r.fundusze[0]) r.fundusze[0].nazwa = el.value.trim() || r.fundusze[0].isin; }));
    root.querySelectorAll("[data-rr]").forEach(el => el.addEventListener("change", () => { W.role[+el.dataset.rr].rdzen = el.checked; drawWizard(); }));
    root.querySelectorAll("[data-rdel]").forEach(b => b.onclick = () => { W.role.splice(+b.dataset.rdel, 1); drawWizard(); });
    $("#r-add")?.addEventListener("click", () => { W.role.push({ key: "", nazwa: "", cel: "", rdzen: false, pasmo: 3, fundusze: [] }); drawWizard(); });
    root.querySelectorAll("[data-t]").forEach(el => el.addEventListener("input", () => { const k = el.dataset.t; W.tezy[k] ||= {}; W.tezy[k][el.dataset.tk] = el.dataset.tk === "co_obserwowac" ? el.value.split(",").map(s => s.trim()).filter(Boolean) : el.value; }));
    root.querySelectorAll("[data-o]").forEach(el => el.addEventListener("change", () => { W.otwarcie[+el.dataset.o][el.dataset.ok] = el.value; }));
    $("#o-add2")?.addEventListener("click", () => { W.otwarcie.push({ isin: "", konto: "zwykle", wartosc: "", koszt: "" }); drawWizard(); });
    $("#sheet-bg").addEventListener("click", e => { if (e.target.id === "sheet-bg") closeWizard(); });
    $("#w-x").onclick = closeWizard;
    $("#w-back")?.addEventListener("click", () => { wStep--; drawWizard(); $(".sheet").scrollTop = 0; });
    $("#w-next")?.addEventListener("click", () => {
      if (W_STEPS[wStep] === "Twój poziom" && !W.poziom) { $("#w-msg").textContent = "Wybierz poziom, żeby przejść dalej."; return; }
      if (W_STEPS[wStep] === "Podział") { const ww = wWarnings(); if (!W.role.length) { $("#w-msg").textContent = "Dodaj przynajmniej jedną rolę."; return; } if (Math.abs(ww.sum - 100) > 0.01) { $("#w-msg").textContent = `Wagi muszą dać razem 100% (teraz ${nf(ww.sum, 1)}%).`; return; } if (W.role.some(r => !r.fundusze.length)) { $("#w-msg").textContent = "Każda rola potrzebuje funduszu."; return; } W._tplAuto = false; }
      wStep++; drawWizard(); $(".sheet").scrollTop = 0;
    });
    $("#w-save")?.addEventListener("click", saveWizard);
  }
  function applyTpl(t) {
    W.role = t === "jeden" ? [{ key: "rdzen", nazwa: "Rdzeń: cały świat", cel: 100, rdzen: true, pasmo: 5, fundusze: [] }]
      : t === "rdzen" ? [{ key: "rdzen", nazwa: "Rdzeń: świat", cel: "", rdzen: true, pasmo: 5, fundusze: [] }, { key: "", nazwa: "Satelita 1", cel: "", rdzen: false, pasmo: 3, fundusze: [] }, { key: "", nazwa: "Satelita 2", cel: "", rdzen: false, pasmo: 3, fundusze: [] }]
      : t === "obl" ? [{ key: "rdzen", nazwa: "Rdzeń: świat", cel: "", rdzen: true, pasmo: 5, fundusze: [] }, { key: "", nazwa: "Złoto", cel: "", rdzen: false, pasmo: 3, fundusze: [] }]
      : [];
  }
  function closeWizard() { W = null; closeSheet(); }
  async function saveWizard() {
    const btn = $("#w-save"); btn.disabled = true; $("#w-msg").textContent = "Zapisuję…";
    const old = S.plan || {}, P = W.profil;
    const used = new Set(), role = {}, notowania = { ...(old.notowania || {}) };
    let coreTaken = false;
    for (const r of W.role) {
      let key = r.rdzen && !coreTaken ? "rdzen" : (r.key && r.key !== "rdzen" ? r.key : slug(r.nazwa));
      if (key === "rdzen") coreTaken = true;
      while (used.has(key)) key += "_2";
      used.add(key);
      const fundusze = Object.fromEntries(r.fundusze.map(f => [f.isin, f.nazwa]));
      for (const i of W.nieDokup) if ((old.role?.[r.key]?.fundusze || {})[i]) fundusze[i] = old.role[r.key].fundusze[i]; // keep old positions visible in their role
      role[key] = { nazwa: r.nazwa || "Rola", cel: +r.cel || 0, pasmo: +r.pasmo || 0, rdzen: !!r.rdzen, fundusze };
      for (const f of r.fundusze) if (KAT[f.isin]) notowania[f.isin] ||= KAT[f.isin].yahoo;
      if (r.key && r.key !== key && W.tezy[r.key]) { W.tezy[key] = W.tezy[r.key]; }
    }
    const tezy = {};
    for (const [k, t] of Object.entries(W.tezy)) if (role[k] && !role[k].rdzen && (t.teza || t.kiedy_sie_myle)) tezy[k] = t;
    const nowy = { ...old, opis: "Plan ustawiony w aplikacji. Wagi i tezy ustala właściciel.", ustalono: today(),
      rdzen_satelity: `${nf(Object.values(role).filter(r => r.rdzen).reduce((s, r) => s + r.cel, 0), 0)}/${nf(Object.values(role).filter(r => !r.rdzen).reduce((s, r) => s + r.cel, 0), 0)}`,
      role, nie_dokupujemy: W.nieDokup, notowania, wskazniki: old.wskazniki || DEFAULT_WSK, tezy,
      profil: { ...P, wplata: +P.wplata || 0, cel_kwota: +P.cel_kwota || 0, cel_rok: +P.cel_rok || 0, wydatki: +W.wydatki || 0, bezpieczny: W.bezpieczny === "" ? "" : +W.bezpieczny } };
    const ce = S.cele || {}, rok = new Date().getFullYear();
    const cele = { ...ce, poduszka: { cel: +W.poduszka.cel || 0, zebrane: +W.poduszka.zebrane || 0 },
      limity: ce.limity?.rok === rok ? ce.limity : { rok, ike: 28260, ikze: 11304, ike_wplacone: 0, ikze_wplacone: 0, ...(ce.limity?.rok === rok ? ce.limity : {}) },
      obligacje: ce.obligacje || [] };
    try {
      await db.doc("app/plan").set(nowy);
      await db.doc("app/cele").set(cele);
      for (const o of W.otwarcie) {
        if (!o.isin || !(+o.wartosc > 0)) continue;
        const p = S.stan?.ceny?.[o.isin];
        await db.collection("transakcje").add({ data: today(), konto: o.konto, isin: o.isin, ticker_xtb: "", typ: "kupno",
          jednostki: p ? +(+o.wartosc / p.pln).toFixed(6) : null, cena: null, waluta: p?.waluta || "", kwota_pln: +o.koszt || +o.wartosc,
          wartosc_otwarcia_pln: +o.wartosc, otwarcie: true, do_przeliczenia: !p, uwagi: "stan otwarcia z kreatora planu" });
      }
      if (+P.wplata) await saveCfg({ wplata: +P.wplata });
      closeWizard(); show("start");
    } catch (e) { $("#w-msg").textContent = writeErr(e); btn.disabled = false; }
  }

  /* ---------- render and data ---------- */
  function renderAll() {
    const c = calc();
    const asof = S.stan?.asOf;
    $("#asof").textContent = asof ? "kursy z " + asof.slice(8, 10) + "." + asof.slice(5, 7) : (S.loaded.stan ? "brak kursów" : "wczytuję…");
    renderStart(c); renderBudzet(); renderPortfel(c); renderCele();
    if (!aiBusy) renderRaporty(c);
    maybeSnapshot(c);
    // a new person without a plan gets the wizard once, right after their data has loaded
    if (!wizShown && db && S.canWrite && S.loaded.plan && S.loaded.tx && !S.plan && !sheet) { wizShown = true; openWizard(); }
  }
  // one history point per price update, written by the owner's view when it first sees new prices
  async function maybeSnapshot(c) {
    if (snapWritten || !db || !S.canWrite || !S.loaded.historia || !S.loaded.tx || !S.stan?.asOf || !c.list.length) return;
    const id = S.stan.asOf.slice(0, 10);
    snapWritten = true;
    if (S.historia.some(h => h._id === id)) return;
    try { await db.doc("historia/" + id).set({ data: id, wartosc: Math.round(c.total), wplacono: Math.round(c.wplacono) }); } catch (e) {}
  }
  let rq = false;
  const queue = () => { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; if (!sheet) renderAll(); else pendingRender = true; }); };
  let pendingRender = false;
  setInterval(() => { if (pendingRender && !sheet) { pendingRender = false; renderAll(); } }, 500);
  renderAll();

  (async () => {
    const timer = setTimeout(() => { const n = $("#notice"); n.textContent = "Dane jeszcze się nie wczytały. Strona spróbuje dalej sama."; n.hidden = false; }, 10000);
    const ok = () => { clearTimeout(timer); $("#notice").hidden = true; };
    try { db = await window.PortfelBackend.connect(); } catch (e) { db = null; }
    if (!db) { clearTimeout(timer); const n = $("#notice"); n.textContent = "Nie udało się połączyć z bazą. Sprawdź internet i odśwież aplikację."; n.hidden = false; $("#asof").textContent = ""; return; }
    const user = null;
    if (user) { const can = await user.can?.("data.write"); if (can === false) S.canWrite = false; }
    const fail = () => { clearTimeout(timer); const n = $("#notice"); n.textContent = "Nie udało się wczytać danych. Odśwież stronę później."; n.hidden = false; };
    const docSub = (path, key) => db.doc(path).onSnapshot(s => { S[key] = s.exists ? s.data() : null; if (!s.metadata.fromCache) { S.loaded[key] = true; ok(); } queue(); }, fail);
    db.doc("app/ustawienia").onSnapshot(s => { if (s.exists) { CFG = { ...DEFAULT_CFG, ...s.data() }; applyCfg(); queue(); } }, () => {});
    docSub("app/plan", "plan"); docSub("app/stan", "stan"); docSub("app/cele", "cele"); docSub("app/budzet", "budzetCfg"); docSub("przeglad/" + curMonth(), "przeglad");
    const colSub = (q, key) => q.onSnapshot(s => { S[key] = s.docs.map(d => ({ _id: d.id, ...d.data() })); if (!s.metadata.fromCache) S.loaded[key] = true; queue(); }, fail);
    colSub(db.collection("transakcje"), "tx");
    colSub(db.collection("raporty").orderBy("data", "desc").limit(60), "raporty");
    colSub(db.collection("analizy").orderBy("data", "desc").limit(30), "analizy");
    colSub(db.collection("historia"), "historia");
    colSub(db.collection("budzet").orderBy("data", "desc").limit(1000), "budzet");
    colSub(db.collection("dzienne").orderBy("data", "desc").limit(30), "dzienne");
    sample = null;
    queue();
  })();
})();
</script>

</body>
