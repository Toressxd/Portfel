name: Audio raportów

# Reads new reports and library lessons aloud (Polish neural voice) and saves the MP3 for the app's player.
# Main trigger: the report task on the owner's PC pushes .nagraj right after saving reports, so the recording follows at once.
# Backup: every 30 minutes during the day (GitHub skips many scheduled runs); a run with nothing new ends in seconds.
on:
  schedule:
    - cron: "*/30 5-21 * * *"
  push:
    branches: [main]
    paths: ["wiedza.json", "tools/audio.py", ".nagraj"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "edge-tts>=7,<8"
      - name: Nagraj raporty
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/audio.py
